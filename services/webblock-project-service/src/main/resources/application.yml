spring:
  application:
    name: web-block
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PROJECT_DB_URL:jdbc:postgresql://localhost:5432/webblock_project}
    username: ${PROJECT_DB_APP_USER:project_app_login}
    password: ${PROJECT_DB_APP_PASSWORD:}
    hikari:
      # Every statement and lock wait is bounded, so a stuck lock cannot pin a request and its pooled connection; the
      # error answers 503 DEPENDENCY_UNAVAILABLE. Run on each new connection, not set through the driver property
      # options. The migration job and Flyway use their own connections and are not bounded by them.
      connection-init-sql: "SET statement_timeout = '10s'; SET lock_timeout = '5s'"
      # A connection closed under the pool (a laptop sleep, a dropped socket, a database restart) is found by the
      # keepalive and replaced, and no connection outlives max-lifetime. Two stay ready when idle. The validation
      # stays below Hikari's 30 s connection-timeout, which keeps its default. Milliseconds: Hikari's setters take a
      # long, so "60s" does not bind.
      keepalive-time: 60000 # 60 s
      max-lifetime: 600000 # 10 min
      idle-timeout: 300000 # 5 min
      minimum-idle: 2
      validation-timeout: 3000 # 3 s
      data-source-properties:
        # pgjdbc otherwise puts "Detail: Failing row contains (...)" (customer content) into SQLException messages, which
        # Hibernate, the catch-all handler and the outbox's failure_reason would log or store. The constraint name stays.
        # A URL parameter would replace a driver property of the same name, so ProfileGuard refuses a PROJECT_DB_URL
        # that sets logServerErrorDetail, socketTimeout or options.
        logServerErrorDetail: "false" # a string: the driver reads Properties.getProperty()
        # Seconds; longer than the statement timeout, so only a dead or half-open connection reaches it.
        socketTimeout: "15"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    user: ${PROJECT_DB_MIGRATOR_USER:project_migrator_login}
    password: ${PROJECT_DB_MIGRATOR_PASSWORD:}
    init-sqls: SET ROLE project_migrator
    # project: business tables; project_messaging: inbox and outbox; project_ops: Flyway's history table only.
    schemas: project_ops,project,project_messaging
    default-schema: project_ops
    locations: classpath:db/migration/project
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:project}
    password: ${RABBITMQ_PASSWORD:}
    # An unreachable broker fails the connect (the readiness check, the outbox relay) within 3 s, not the client's 60 s
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
  # Outgoing events: Modulith externalization stored in the Namastack outbox (decision 0001,
  # .claude/docs/decisions/0001-outbox-with-modulith-and-namastack.md).
  # The Modulith event publication registry is not used (no event_publication table): Namastack is the outbox. In
  # Modulith 2.1.1 its auto-configuration cannot start without a registry, so it is excluded.
  autoconfigure:
    exclude: org.springframework.modulith.events.config.EventPublicationAutoConfiguration
  modulith:
    events:
      externalization:
        mode: outbox
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PROJECT_JWT_ISSUER_URI:http://localhost:8180/realms/webblock}
          audiences: project
server:
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 2MB
management:
  server:
    port: ${PROJECT_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # Not ready to serve when a database or the broker is down (liveness stays independent of them).
          include: readinessState,db,catalogDb,rabbit
logging:
  structured:
    format:
      console: ecs
webblock:
  grpc:
    # The gRPC server (CheckAccess, decision 0011); the Service names this port grpc
    port: 9090
    # Calls in flight may finish for this long at stop; then they are cut
    shutdown-grace: 10s
    # Calls running at once; more answer UNAVAILABLE, DEPENDENCY_UNAVAILABLE. Below the database pool (10), which
    # REST shares
    max-calls-in-flight: 8
  http:
    max-body-bytes: 1572864 # 1.5 MiB; the Puck tree is at most 1 MB (spec section 9)
    retry-after-seconds: 5 # Retry-After on every 503 (dependency errors) and on 409 ADMISSION_RELEASE_PENDING
  security:
    user-id-claim: user_id
    # jwt (Keycloak) or dev-tokens (the prototype's stand-in)
    identity-mode: jwt
    dev-tokens-file: ""
  generation:
    # The site-side CRUD and auth API version the generated code targets (J2-3); not the business type
    api-contract-version: 1.0.0
    # Payment admission retries end this long after capture (J2-18)
    admission-window: 15m
    # A request still captured this long after the admission window is failed admission_unavailable by the sweeper
    # (FR-28), so a lost admission job never blocks the website
    stuck-capture-margin: 5m
    # The pause between two sweeps for such requests
    stuck-sweep-interval: 1m
  platform:
    # The suffix Provisioning serves sites under (its SITE_DOMAIN); a site is <subdomain>.<site-domain>
    site-domain: ${PROJECT_SITE_DOMAIN:sites.webblock.test}
    # Sub-domains no client may choose (FR-13); each entry is a valid sub-domain label
    reserved-subdomains: www, app, api, admin, git, mail, status, docs, auth, preview, webblock, billing, support
  pages:
    max-puck-tree-bytes: 1048576
  catalog:
    datasource:
      url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog}
      username: ${CATALOG_DB_PLATFORM_USER:catalog_platform_login}
      password: ${CATALOG_DB_PLATFORM_PASSWORD:}
      maximum-pool-size: 5
    migrations:
      enabled: ${CATALOG_MIGRATIONS_ENABLED:true}
      user: ${CATALOG_DB_MIGRATOR_USER:catalog_migrator_login}
      password: ${CATALOG_DB_MIGRATOR_PASSWORD:}
    # Defaults until Payment carries plan limits
    storage-limit-bytes: 104857600
    max-image-bytes: 2097152
  payment:
    mode: http
    base-url: ${PAYMENT_BASE_URL:http://payment.invalid}
    timeout: 2s
    stand-in-file: ""
springdoc:
  # The OpenAPI description (/v3/api-docs) and Swagger UI (TR-40): off here, on only in application-prototype.yml.
  # springdoc serves both when these are unset, so they stay set; ProfileGuard refuses production with either on.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
namastack:
  outbox:
    jdbc:
      schema-name: project_messaging # every Namastack query names project_messaging.<table> explicitly
      schema-initialization:
        enabled: false # the tables come from Flyway (V4__outbox.sql)
    rabbit:
      enable-json: false # MessagingConfig builds the AMQP message; the RabbitTemplate's converter stays untouched
      publisher-confirm-timeout: 10s
      fail-on-unroutable: false # an event with no bound queue yet must not block its project's later events
    polling:
      trigger: fixed
      fixed:
        interval: 1s
      batch-size: 10
    processing:
      stop-on-first-failure: true # a key waits while its oldest record is retried: per-project order
      delete-completed-records: false # project_app has no DELETE on outbox_record
      executor-concurrency-limit: 10 # at most batch-size keys are sent at once
    retry:
      # Default policy, used by the Rabbit handler: retry for as long as the broker is unreachable.
      policy: exponential
      max-retries: 2147483647
      exponential:
        initial-delay: 1s
        multiplier: 2.0
        max-delay: 60s
      jitter: 500ms # spreads retries of records that failed together
    instance:
      heartbeat-interval: 5s
      stale-instance-timeout: 30s
      rebalance-interval: 10000 # milliseconds
