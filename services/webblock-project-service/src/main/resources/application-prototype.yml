# Prototype profile: stand-ins for the open contracts (spec section 8). Refused by the production profile.
webblock:
  security:
    identity-mode: ${PROJECT_IDENTITY_MODE:dev-tokens}
    dev-tokens-file: ${PROJECT_DEV_TOKENS_FILE:}
  payment:
    mode: ${PROJECT_PAYMENT_MODE:stand-in}
    stand-in-file: ${PROJECT_PAYMENT_STAND_IN_FILE:}
# The OpenAPI description at /v3/api-docs and Swagger UI at /swagger-ui/index.html (TR-40), without a token. Only the
# user REST API is described; /internal/** never is. Notion "Web Block architecture" stays the API contract.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  paths-to-match: /api/v1/**
