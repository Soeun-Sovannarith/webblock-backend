plugins {
    id 'java'
    id 'jacoco'
    id 'pmd'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.spotless)
    alias(libs.plugins.errorprone)
    alias(libs.plugins.spotbugs)
    alias(libs.plugins.protobuf)
}

group = 'org.kshrd.webblock'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

// Namastack Outbox 1.7.3 is compiled with Kotlin 2.4 and declares kotlin-stdlib 2.4.10; without this the Spring Boot
// 4.1.1 BOM would resolve the Kotlin runtime down to 2.3.21.
ext['kotlin.version'] = libs.versions.kotlin.get()

// Security overrides of Spring Boot 4.1.1 BOM-managed versions (OSV, 2026-10-13); see .claude/docs/dependency-versions.md.
ext['rabbit-amqp-client.version'] = '5.37.0' // fixes 10 GHSA advisories (BOM manages 5.30.0)
ext['tomcat.version'] = '11.0.25' // fixes CVE-2026-65905, CVE-2026-65182, CVE-2026-68525 (BOM manages 11.0.24)
ext['jackson-bom.version'] = '3.1.7' // fixes 7 GHSA advisories in jackson-core and jackson-databind (BOM manages 3.1.5)
// Jackson 2 comes only through springdoc's swagger-core (TR-40): 2.21.7 fixes 7 GHSA advisories (BOM manages 2.21.5).
ext['jackson-2-bom.version'] = '2.21.7'
// gRPC and protobuf at the versions the catalog pins (equal to the BOM's and to web-block-commons').
ext['grpc-java.version'] = libs.versions.grpc.get()
ext['protobuf-java.version'] = libs.versions.protobuf.java.get()

// The CheckAccess stubs (TR-10, decision 0011): protoc and protoc-gen-grpc-java compile the pinned protos of
// contracts/ (written only by scripts/contracts-sync.sh) in their own source set. Main compiles and runs against it
// and the boot jar ships it; JaCoCo, Spotless, PMD and CPD keep covering main only.
sourceSets {
    contracts {
        proto {
            srcDir 'contracts/proto'
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.java.get()}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${libs.versions.grpc.get()}"
        }
    }
    generateProtoTasks {
        all().configureEach {
            plugins {
                grpc {}
            }
        }
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${libs.versions.spring.modulith.get()}"
        mavenBom "io.namastack:namastack-outbox-bom:${libs.versions.namastack.outbox.get()}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    // Transactional outbox: Modulith externalization (mode "outbox") stored by Namastack, sent by its Rabbit module.
    implementation 'org.springframework.modulith:spring-modulith-starter-namastack'
    implementation 'io.namastack:namastack-outbox-api'
    implementation 'io.namastack:namastack-outbox-rabbit'
    implementation libs.java.uuid.generator
    implementation libs.json.schema.validator
    implementation libs.json.canonicalization
    implementation sourceSets.contracts.output
    implementation libs.grpc.api
    implementation libs.grpc.stub
    implementation libs.grpc.protobuf
    implementation libs.grpc.netty.shaded
    implementation libs.protobuf.java
    implementation libs.proto.google.common.protos
    // OpenAPI description of /api/v1 and Swagger UI; off in application.yml, on only in the prototype profile (TR-40).
    implementation libs.springdoc.openapi.starter.webmvc.ui
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    errorprone libs.errorprone.core

    contractsImplementation libs.grpc.api
    contractsImplementation libs.grpc.stub
    contractsImplementation libs.grpc.protobuf
    contractsImplementation libs.protobuf.java
    contractsImplementation libs.proto.google.common.protos

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-rabbitmq'
    testImplementation 'org.postgresql:postgresql'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation libs.archunit.junit5
    testImplementation libs.wiremock.standalone
    testImplementation libs.grpc.inprocess
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.errorprone.disableWarningsInGeneratedCode = true
    // Deprecated and for-removal API calls are printed as warnings; they do not fail the build (decision 0009).
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal'])
}

// The contracts source set holds only code protoc generates from contracts/proto: Error Prone skips it. Main and test
// keep every Error Prone check.
tasks.named('compileContractsJava', JavaCompile) {
    options.errorprone.excludedPaths = '.*/build/generated/.*'
}

// GHSA-xxph-c9ww-hj94 (High) is in guava before 33.7.2. Error Prone 2.50.0 declares 33.5.0-jre: the annotation
// processor classpaths, which carry Error Prone, get 33.7.2-jre. gRPC 1.83.1 declares 33.6.0-android: every other
// classpath gets 33.7.2-android. The rule only raises: a request up to the pin's release gets the pin, and a request
// for a later release keeps its version, so the lockfile shows it. See .claude/docs/dependency-versions.md.
def guavaRelease = { String version ->
    def numbers = (version =~ /^\d+(\.\d+)*/)
    numbers.find() ? numbers.group().tokenize('.').collect { it as int } : []
}
def guavaAtMostPin = { String requested, String pin ->
    def asked = guavaRelease(requested)
    def pinned = guavaRelease(pin)
    for (int i = 0; i < Math.max(asked.size(), pinned.size()); i++) {
        int a = i < asked.size() ? asked[i] : 0
        int p = i < pinned.size() ? pinned[i] : 0
        if (a != p) {
            return a < p
        }
    }
    return true
}
configurations.configureEach { configuration ->
    def processor = configuration.name == 'annotationProcessor' || configuration.name.endsWith('AnnotationProcessor')
    configuration.resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.google.guava' && details.requested.name == 'guava') {
            def pin = processor ? libs.versions.guava.errorprone.get() : libs.versions.guava.grpc.get()
            def requested = details.requested.version
            if (!requested || guavaAtMostPin(requested, pin)) {
                details.useVersion(pin)
                details.because('GHSA-xxph-c9ww-hj94 in guava before 33.7.2')
            }
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'integration', 'messaging'
    }
    // AccessActionListTest reads the synced access action list from contracts/access (TR-27): a new list reruns it.
    inputs.dir('contracts/access').withPropertyName('accessActionList').withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.register('integrationTest', Test) {
    description = 'Runs the tests that need Docker: PostgreSQL 18 and RabbitMQ.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration', 'messaging'
    }
    shouldRunAfter tasks.named('test')
}

def jacocoData = fileTree(layout.buildDirectory.dir('jacoco')).include('*.exec')

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    executionData.setFrom(jacocoData)
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    executionData.setFrom(jacocoData)
    // The bootstrap class only calls SpringApplication.run; it is exercised by no unit test.
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(it) { exclude 'org/kshrd/webblock/project/WebBlockApplication.class' }
    }))
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.70
            }
        }
        rule {
            element = 'PACKAGE'
            includes = ['org.kshrd.webblock.project.common*']
            limit {
                counter = 'LINE'
                minimum = 0.80
            }
        }
        rule {
            element = 'CLASS'
            // Use cases in each feature's application handler folder, entities in its domain model folder (the
            // layer-first layout of Notion 6.1, decision 0016).
            includes = [
                'org.kshrd.webblock.project.application.*.handler.*Service',
                'org.kshrd.webblock.project.domain.*.model.*Entity'
            ]
            limit {
                counter = 'LINE'
                minimum = 0.80
            }
        }
    }
}

// The boot jar ships the CheckAccess stubs of the contracts source set (TR-10, decision 0011).
def bootJarArchive = tasks.named('bootJar').flatMap { it.archiveFile }
tasks.register('contractStubsInBootJar') {
    description = 'Fails unless the boot jar holds the stubs generated from contracts/proto.'
    group = 'verification'
    def required = ['BOOT-INF/classes/webblock/project/v1/AccessServiceGrpc.class']
    inputs.file(bootJarArchive)
    doLast {
        def jar = bootJarArchive.get().asFile
        new java.util.zip.ZipFile(jar).withCloseable { zip ->
            def missing = required.findAll { zip.getEntry(it) == null }
            if (missing) {
                throw new GradleException("${jar.name} has no ${missing.join(', ')}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest'), tasks.named('jacocoTestCoverageVerification'),
            tasks.named('contractStubsInBootJar')
}

spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat(libs.versions.palantir.java.format.get())
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Code quality tools (decision 0009): report-only, never in the application jar, not part of `check`.
// `./gradlew pmdMain pmdTest spotbugsMain cpd` writes the reports under build/reports/; the qa-sweep skill
// triages them.
pmd {
    toolVersion = libs.versions.pmd.get()
    ruleSets = []
    ruleSetFiles = files('config/pmd/ruleset.xml')
    ignoreFailures = true
    consoleOutput = false
    sourceSets = [] // keeps pmdMain and pmdTest out of `check`; they still run when named
}

spotbugs {
    toolVersion = libs.versions.spotbugs.core.get()
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
    ignoreFailures = true
    excludeFilter = file('config/spotbugs/exclude.xml')
    runOnCheck = false // keeps spotbugsMain and spotbugsTest out of `check`; they still run when named
}

// CPD runs on its own classpath: Gradle's `pmd` configuration leaves out SLF4J, which the CPD Ant task needs. SLF4J
// 1.7.36 with slf4j-simple is what the PMD 7.28.0 distribution ships.
configurations {
    cpd {
        description = 'PMD CPD (duplicate code) for the cpd task; never on an application classpath.'
        canBeConsumed = false
    }
}

dependencies {
    cpd libs.pmd.java
    cpd libs.pmd.ant
    cpd libs.slf4j.simple.pmd
}

// The Spring dependency-management plugin manages every configuration; the tools get back the versions they declare.
['pmd', 'cpd', 'spotbugs', 'spotbugsPlugins', 'spotbugsSlf4j'].each { name ->
    configurations.named(name) {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.version) {
                details.useVersion(details.requested.version)
            }
        }
    }
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

tasks.register('cpd') {
    description = 'Finds duplicated main code (PMD CPD, 100 tokens or more); report in build/reports/cpd/.'
    group = 'verification'
    notCompatibleWithConfigurationCache('Runs the PMD CPD Ant task')
    def cpdClasspath = configurations.named('cpd')
    def sourceDir = file('src/main/java')
    def sources = fileTree(sourceDir) { include '**/*.java' }
    def report = layout.buildDirectory.file('reports/cpd/cpd-main.xml')
    inputs.files(sources)
    outputs.file(report)
    doLast {
        def out = report.get().asFile
        out.parentFile.mkdirs()
        ant.taskdef(name: 'cpd', classname: 'net.sourceforge.pmd.ant.CPDTask', classpath: cpdClasspath.get().asPath)
        ant.cpd(language: 'java', minimumTokenCount: 100, ignoreAnnotations: true, format: 'xml',
                encoding: 'UTF-8', outputFile: out.path) {
            fileset(dir: sourceDir) { include(name: '**/*.java') }
        }
    }
}

tasks.register('resolveAndLockAll') {
    description = 'Resolves every configuration so that --write-locks records all of them.'
    notCompatibleWithConfigurationCache('Resolves configurations at execution time')
    doFirst {
        assert gradle.startParameter.writeDependencyLocks : 'Run with --write-locks'
    }
    doLast {
        configurations.findAll { it.canBeResolved }.each { it.resolve() }
    }
}
