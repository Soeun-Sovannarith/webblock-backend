# Alembic runs the numbered SQL files in sql/ (the source of truth) and records which ones a database has applied
# in public.alembic_version. Each revision in migrations/versions/ runs one file. The database comes from the
# service's settings (.env: DATABASE_URL, USER_NAME, DB_PASSWORD, DB_MIGRATION_ROLE), never from this file.
#
#   alembic upgrade head            apply what the database is missing
#   alembic current / history       what it has / what exists
#   alembic upgrade head --sql      print the SQL instead of running it (to run in pgAdmin)
#   alembic revision --rev-id 006 -m "short description"   new revision for sql/006_short_description.sql
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
