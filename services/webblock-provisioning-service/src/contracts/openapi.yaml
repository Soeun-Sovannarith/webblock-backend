openapi: 3.0.3
info:
  title: WebBlock Provisioning API
  version: 0.2.0
  description: >-
    Draft contract for the REST surface that Provisioning owns. The paths
    and the revision 16 amendments are decision 0006 sections 2 and 3, and
    version 0.2.0 is the one breaking
    release of decision 0023 (G1 to G7). A release is created from the Project
    service's "source published" event and its build starts automatically, so
    no operation creates a release. The build operation (decision 0014) only
    starts or retries the build of an existing release. Hosting is suspended and
    resumed from Payment's and Project's events, and by platform staff through
    the four admin operations under /v1/admin/projects/{projectId} (decision
    0023 G9 to G13): suspend and resume a site, redeploy its live release, and
    read its commands with their requester. Only a caller holding the ADMIN
    role takes them, on any project, without the project access check. The
    rollback of an uncertain route (FR-50) keeps its path under /v1/projects
    and is ADMIN only in the same way. Source
    repository, commit, image, namespace and hostname always come from trusted
    records and are never accepted from the caller. The two listing reads
    (decision 0014 section 21 ruling 7) page through a project's releases and
    commands with limit and cursor; they add no mutation. Every success is the
    envelope of Notion 2.1 (success, data, meta; decision 0023 G2), served as
    application/json; every error is a Problem (decision 0023 G5). Every name
    a client sees (body fields, path and query parameters) is camelCase; the
    values of enums and failure codes are unchanged (G3). The response shapes
    are Provisioning's draft and have not been reviewed by their consumers
    (open decision OD-25).
  x-status: draft
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: releases
  - name: commands
  - name: deployment
  - name: admin
paths:
  /v1/projects/{projectId}/releases/{releaseId}/deploy:
    post:
      operationId: deploy_release
      summary: Accept private candidate deployment
      description: >-
        Accepts a private candidate deployment of a built release. Public
        traffic does not move. Takes no request body: a body must be absent,
        empty, or the empty JSON object. Refused with 409 COMMAND_IN_PROGRESS
        when another command of the project is in flight, and with 422 when
        the route is not stable, hosting is offline, the release is not built,
        or the release was created before the live release.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ReleaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Durably accepted. data is the accepted command; poll its statusUrl for progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/releases/{releaseId}/promote:
    post:
      operationId: promote_release
      summary: Accept route promotion
      description: >-
        Accepts promotion of a candidate_ready release by changing route
        intent. If the promotion fails, the same command restores the route to
        the project's live release. Takes no request body: a body must be
        absent, empty, or the empty JSON object. Refused with 409
        COMMAND_IN_PROGRESS when another command of the project is in flight,
        and with 422 when the route is not stable, hosting is offline, the
        release is not candidate_ready, or the release was created before the
        live release.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ReleaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Durably accepted. data is the accepted command; poll its statusUrl for progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/releases/{releaseId}/rollback:
    post:
      operationId: rollback_release
      tags: [admin]
      summary: Operator recovery of an uncertain route to the live release or the offline page
      description: >-
        Operator recovery. Accepted only when the project's routingStatus is
        uncertain, which is the state a failed or unverified route change
        leaves behind. The path names the release that is still promoting; the
        route is restored to the project's live release (liveReleaseId), or
        to the offline page when hostingStatus is offline or the project has
        no live release, never to a release chosen by the caller. It is not a
        way to leave a healthy live release: with any other routing status the
        request is a 422 RELEASE_STATE_INVALID.
        Takes no request body: a body must be absent, empty, or the empty JSON
        object. Entitlement is not consulted, so recovery is never blocked by
        an expired plan and PUBLISH_LIMIT_REACHED never answers it. Only a
        caller whose roles hold `ADMIN` (exactly, case-sensitive) may call
        it, on any project, without the project access check (FR-50,
        decision 0019 section 7, OD-45); anyone else, the project's owner
        included, is 403 ACCESS_DENIED before the project is looked at. The
        command records the admin's subject. The production profile refuses
        it with 503 OPERATION_UNAVAILABLE, as every mutation. The reads keep
        the owner check, so for an ADMIN who does not own the project the
        returned status URL (get_command) and get_deployment answer 404
        PROJECT_NOT_FOUND; such an admin follows the command through the
        operator tools or the logs until admin reads are designed (OD-45).
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ReleaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Durably accepted. data is the accepted command; poll its statusUrl for progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/releases/{releaseId}:
    get:
      operationId: get_release
      summary: Read release and step status
      description: Returns the persisted release with its steps.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ReleaseId'
      responses:
        '200':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Persisted state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReadConflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/commands/{commandId}:
    get:
      operationId: get_command
      summary: Read accepted command progress
      description: >-
        Returns the persisted command. Any command of the project can be read,
        including a hosting command created from a Payment event, which names
        no release.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CommandId'
      responses:
        '200':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Persisted state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReadConflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/deployment:
    get:
      operationId: get_deployment
      summary: Read the live release, routing status and hosting status
      description: >-
        Returns the project's stored hosting state: the confirmed live
        release, the last command number, the routing status and the hosting
        status, and a summary of the command in flight when there is one. A project
        for which no release was ever accepted has no stored state and is a
        404 DEPLOYMENT_NOT_FOUND.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Persisted state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReadConflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/releases/{releaseId}/diagnostics:
    get:
      operationId: get_release_diagnostics
      summary: Read redacted, bounded diagnostics
      description: >-
        Returns what the stored rows say about a release (decision 0014
        section 21 ruling 6): the release's status and failure code, its most
        recent steps (at most 20, with their failure codes and times), the
        project's most recent commands (at most 10, with their failure codes),
        and the outcome of the "source published" event the release came
        from. The answer is bounded and redacted: it carries codes, counts and
        times only, never a build log location, a failure text, a repository
        or a commit. stepsTruncated and commandsTruncated say whether older
        rows were left out.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ReleaseId'
      responses:
        '200':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Redacted, bounded diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReadConflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/releases/{releaseId}/build:
    post:
      operationId: build_release
      summary: Start or retry the build of a release (prototype)
      description: >-
        Prototype operation (decision 0014 section 3, "Build"; decision 0016
        section 5 item 2). Requests the build of an accepted release, or the
        next build attempt of a building release whose last attempt failed
        while attempts remain. The release's pending build attempt is the
        durable request: this operation checks it, writes nothing, and asks
        the build worker to start it at once; the build worker alone calls
        the build system, and starts the attempt after a short grace even if
        that request is lost. It is not a command: no Idempotency-Key is
        taken, and the build is tracked through the release and its build
        steps. Accepting a "source published" event starts the first build by
        itself. A release that has reached failed is not rebuilt. Takes no
        request body: a body must be absent, empty, or the empty JSON object.
        Refused with 422 RELEASE_NOT_BUILDABLE when the release has no pending
        build attempt, and with 409 BUILD_IN_PROGRESS while an attempt is
        running. Two requests for the same pending attempt are both accepted
        and start it once. The 202 body is the release as read when the
        request was accepted, so its build step may still be pending.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ReleaseId'
      responses:
        '202':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: The build attempt was requested; the build worker starts it. Read the release for progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BuildConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/releases:
    get:
      operationId: list_releases
      summary: List the project's releases, newest first
      description: >-
        Pages through the project's releases, newest first (by creation time,
        then release ID). Each item is a summary without steps; read one
        release with get_release for its steps. data holds the page's
        releases and meta.page its limit and nextCursor; nextCursor is null
        on the last page, otherwise pass it as cursor to read the next page. A project the caller cannot access is a 404 PROJECT_NOT_FOUND,
        like every read; a project without releases is an empty page.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: One page of releases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReadConflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/projects/{projectId}/commands:
    get:
      operationId: list_commands
      summary: List the project's commands, newest first
      description: >-
        Pages through the project's commands, newest first (by command
        number), hosting commands created from Payment events included.
        data holds the page's commands and meta.page its limit and
        nextCursor; nextCursor is null on the last page, otherwise pass it as
        cursor to read the next page. A project the caller cannot access
        is a 404 PROJECT_NOT_FOUND, like every read; a project without commands
        is an empty page.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: One page of commands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReadConflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/admin/projects/{projectId}/hosting/suspend:
    post:
      operationId: suspend_website
      tags: [admin]
      summary: Admin suspend of one site
      description: >-
        Accepts a suspend of the project's site with the offline reason
        admin_suspended (decision 0023 G9 to G11). The command adds only that
        reason: a site already offline for another reason stays offline and
        keeps its other reasons. Only a caller whose roles hold `ADMIN`
        (exactly, case-sensitive) may call it, on any project, without the
        project access check; anyone else is 403 ACCESS_DENIED before the
        project is looked at, so the answer is the same for every project.
        The key is stored as admin:<Idempotency-Key>, so it never takes a key
        of a system event, and the command records the admin's subject. Takes
        no request body: a body must be absent, empty, or the empty JSON
        object. Refused with 409 COMMAND_IN_PROGRESS when another command of
        the project is in flight, and with 422 ROUTE_NOT_STABLE when the route
        is not stable. The production profile refuses it with 503
        OPERATION_UNAVAILABLE, as every mutation.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AdminIdempotencyKey'
      responses:
        '202':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Durably accepted. data is the accepted command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/admin/projects/{projectId}/hosting/resume:
    post:
      operationId: resume_website
      tags: [admin]
      summary: Admin resume of one site
      description: >-
        Accepts a resume of the project's site (decision 0023 G9 to G11). The
        command removes only the offline reason admin_suspended; the site is
        online again only when no other reason is left. It is accepted even
        when the reason is not there. Only a caller whose roles hold `ADMIN`
        may call it, on any project, without the project access check; anyone
        else is 403 ACCESS_DENIED before the project is looked at. The key is
        stored as admin:<Idempotency-Key>, and the command records the admin's
        subject. Takes no request body: a body must be absent, empty, or the
        empty JSON object. Refused with 409 COMMAND_IN_PROGRESS when another
        command of the project is in flight, and with 422 ROUTE_NOT_STABLE
        when the route is not stable. The production profile refuses it with
        503 OPERATION_UNAVAILABLE, as every mutation.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AdminIdempotencyKey'
      responses:
        '202':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Durably accepted. data is the accepted command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/admin/projects/{projectId}/redeploy:
    post:
      operationId: redeploy_release
      tags: [admin]
      summary: Admin redeploy of the live release
      description: >-
        Accepts a redeploy of the project's live release (decision 0023 G9,
        G12): its pods restart one by one with the same image, and the route,
        routingStatus and the release status do not change. The command names
        the release that is live when it is accepted. Only a caller whose
        roles hold `ADMIN` may call it, on any project, without the project
        access check; anyone else is 403 ACCESS_DENIED before the project is
        looked at. The key is in the same key space as deploy, promote and
        rollback, and the command records the admin's subject. Takes no
        request body: a body must be absent, empty, or the empty JSON object.
        Refused with 409 COMMAND_IN_PROGRESS when another command of the
        project is in flight, with 422 REDEPLOY_NOT_ALLOWED when the project
        has no live release (or no site) or hosting is offline, and with 422
        ROUTE_NOT_STABLE when the route is not stable. The production profile
        refuses it with 503 OPERATION_UNAVAILABLE, as every mutation.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: Durably accepted. data is the accepted command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAcceptedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /v1/admin/projects/{projectId}/commands:
    get:
      operationId: admin_list_commands
      tags: [admin]
      summary: Admin list of the project's commands with their requester
      description: >-
        Pages through the project's commands, newest first (by command
        number), as list_commands does, each with requestedBySubject: the
        subject that asked for it, absent for a command from an event (decision
        0023 G9). Only a caller whose roles hold `ADMIN` may call it, on any
        project, without the project access check; anyone else is 403
        ACCESS_DENIED before the project is looked at. A project without
        commands, or one that does not exist, is an empty page. data holds the
        page's commands and meta.page its limit and nextCursor; nextCursor is
        null on the last page, otherwise pass it as cursor to read the next
        page. The production profile serves it.
      parameters:
        - $ref: '#/components/parameters/RequestIdIn'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          description: One page of commands with their requester.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommandListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReadConflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Bearer token issued through the platform identity contract. The issuer,
        audience, agent identity registration and allowed action scopes are open
        decision OD-05 and are deliberately not named here.
  headers:
    RequestId:
      description: >-
        The request ID: the inbound X-Request-Id when it is valid, otherwise a
        new UUIDv7. Returned on every answer (decision 0022 E8).
      schema: { $ref: '#/components/schemas/RequestId' }
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    CommandId:
      name: commandId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    Limit:
      name: limit
      in: query
      required: false
      description: >-
        The number of items per page, 1 to 50; 20 when absent. Given at most
        once, as decimal digits without a plus sign or leading zero. A value
        that is not such a number is `INVALID_FORMAT`; a number outside 1 to
        50 is `OUT_OF_RANGE` (field `limit`).
      schema:
        type: integer
        minimum: 1
        maximum: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        The meta.page.nextCursor of the previous page, unchanged. It is opaque
        and names a position in the list, not a project: the project is
        always the one in the path. Given at most once. A cursor the service
        did not make, or one of the other list, is `INVALID_FORMAT` (field
        `cursor`).
      schema: { $ref: '#/components/schemas/Cursor' }
    RequestIdIn:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        An optional request ID, 1 to 128 characters of letters, digits and
        . _ : -. Any other value is ignored and a new ID is made.
      schema: { $ref: '#/components/schemas/RequestId' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client retry key scoped to the project: 1 to 255 bytes of UTF-8, with
        no control characters and no leading or trailing white space. The
        length is counted in bytes, so a key with multi-byte characters holds
        fewer than 255 characters; the schema below can only bound characters.
        The same key with the same request (the same operation on the same
        project and release) returns the original command, whatever its status.
        The same key with a different request is refused with 422
        IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    AdminIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        The admin's retry key for a suspend or resume, scoped to the project:
        1 to 249 bytes of UTF-8, with no control characters and no leading or
        trailing white space. It is stored as admin:<key>, which keeps the 255
        byte rule, so a key of 250 to 255 bytes is `TOO_LONG` and it never
        takes a key of a system event (project-deleted sent here is a separate
        admin key). The same key with the same request returns the original
        command, whatever its status; with a different request it is refused
        with 422 IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string
        minLength: 1
        maxLength: 249
  responses:
    BadRequest:
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      description: >-
        The request is invalid. Code: `VALIDATION_FAILED`. `errors` lists each
        bad input with its field and one of `REQUIRED`, `INVALID_FORMAT`,
        `OUT_OF_RANGE`, `TOO_LONG`, never the value sent: a path identifier
        (`projectId`, `releaseId`, `commandId`) that is not a canonical
        lowercase UUID or is the nil UUID; the `Idempotency-Key` header missing,
        repeated, too long or invalid; a request body (`body`) on a read, or on
        a mutation that is neither empty nor the empty JSON object; a query
        (`query`) on an operation that takes none, or an unknown or repeated
        parameter, whose name is not echoed; a `Content-Length` that is not
        one decimal number; a `limit` that is not a number (`INVALID_FORMAT`)
        or not from 1 to 50 (`OUT_OF_RANGE`); a `cursor` the service did not
        make (`INVALID_FORMAT`). The old paging names page_size and
        page_token are unknown parameters, so a `query` error. On MCP the field is
        the tool argument; an unknown argument is the field `arguments`; a
        refused header of /mcp names the header (`Host`, `Origin`,
        `Content-Type`, `Accept`) and invalid JSON or a batch the `body`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      description: >-
        Authentication is missing or invalid. Code: `UNAUTHENTICATED`, with one
        title for every cause.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      description: >-
        The token lacks the action. Code: `ACCESS_DENIED`. The action is checked
        before project access, so the answer depends on the token alone and says
        nothing about any project. The admin operations need the `ADMIN` role
        as well: without it they are refused here, before any lookup.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      description: >-
        Code `PROJECT_NOT_FOUND` when the caller has no access to the project
        or the project is unknown, identical in both cases. Once access passed:
        `RELEASE_NOT_FOUND`, `COMMAND_NOT_FOUND` or `DEPLOYMENT_NOT_FOUND`. An
        unknown path, or a method a path does not take, is `RESOURCE_NOT_FOUND`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      description: >-
        The request ran into another change. Codes: `COMMAND_IN_PROGRESS`
        (another command of the project is in flight; the body names it in
        `commandId`), `CONCURRENT_CHANGE` (a concurrent change; retry later).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    BuildConflict:
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      description: >-
        The build cannot start now (build_release only, prototype). Codes:
        `BUILD_IN_PROGRESS` (the release's build attempt is running),
        `CONCURRENT_CHANGE` (a concurrent change; retry later).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      description: >-
        A business rule refuses the request, and a retry cannot help until the
        stored state changes. Codes: `IDEMPOTENCY_KEY_REUSED` (the key was used
        with a different request), `ROUTE_NOT_STABLE` (the route is changing or
        uncertain), `HOSTING_OFFLINE` (hosting is suspended),
        `RELEASE_STATE_INVALID` (the release is in the wrong status for the
        operation, or a rollback was requested while the route is not
        uncertain), `RELEASE_OUTDATED` (the release was created before the live
        release), `RELEASE_NOT_BUILDABLE` (build_release: the release is neither
        accepted nor building with a pending next attempt),
        `COMMAND_NUMBER_EXHAUSTED` (the project's lastCommandNumber has
        reached its maximum), `PUBLISH_LIMIT_REACHED` (a limit owned by the
        Payment service; deploy_release and promote_release only),
        `REDEPLOY_NOT_ALLOWED` (redeploy_release: the project has no live
        release, or hosting is offline).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    ReadConflict:
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      description: >-
        The read met a concurrent change (a lock it waited for was not
        granted in time). Code: `CONCURRENT_CHANGE`; retry later. A read
        answers no other 409.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      description: >-
        The request body is larger than the limit for the operation. Code:
        `REQUEST_TOO_LARGE`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Internal:
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      description: >-
        An unexpected failure. Code: `INTERNAL_ERROR`, with a fixed title; the
        detail is in the service logs only.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      description: >-
        The request cannot be served now. Mutations fail closed. Codes:
        `DEPENDENCY_UNAVAILABLE` (a required dependency, the database included,
        is down or not configured), `PROJECT_ACCESS_UNAVAILABLE` (project access
        cannot be checked), `IDENTITY_UNAVAILABLE` (identity keys cannot be
        fetched), `SERVICE_OVERLOADED` (the in-flight limit is reached),
        `OPERATION_UNAVAILABLE` (the operation is switched off or not available
        in this phase). A project access failure is always
        `PROJECT_ACCESS_UNAVAILABLE` at 503, a passed deadline included, so it
        looks the same for every project. When another call to the Project or
        Payment service failed with an `ErrorInfo.reason` in UPPER_SNAKE that
        does not end in `NOT_FOUND`, that reason is the code instead, with the
        title of the code it replaces: at 503, or at our own status when the
        reason is one of our codes, or at 504 after a deadline (decision 0023
        G14 and its precision). If the operation does not declare that status,
        the answer is our own `DEPENDENCY_UNAVAILABLE` or `DEPENDENCY_TIMEOUT`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    GatewayTimeout:
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      description: >-
        A deadline passed. Codes: `REQUEST_TIMEOUT` (the request took longer than
        the service allows), `DEPENDENCY_TIMEOUT` (the Project or Payment service
        did not answer before the call's deadline; a reason the service sent
        with it is the code instead, as for 503). A project access check that
        timed out is a 503 `PROJECT_ACCESS_UNAVAILABLE`, never a 504.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    RequestId:
      type: string
      pattern: '^[A-Za-z0-9._:-]{1,128}$'
    Uuid:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      not:
        enum: ['00000000-0000-0000-0000-000000000000']
    Timestamp:
      type: string
      format: date-time
      maxLength: 40
    LastCommandNumber:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: >-
        The number of the project's last accepted command, its fencing
        counter. It is 0 until the project's first command is accepted and
        advances by exactly one for each accepted command.
    CommandNumber:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
      description: >-
        The project's last command number after the acceptance that created
        this command, which fences the command's work. Assigned by the server;
        never sent by a client.
    Problem:
      type: object
      additionalProperties: false
      description: >-
        An RFC 9457 Problem Details object (decisions 0018 and 0023 G5),
        served as application/problem+json, or as application/json (the same
        body) to a client whose Accept header allows only that. Sanitized: it
        never carries provider error text, tokens, customer content or a
        value the caller sent, and it has no detail member. Members in this
        order: type, title, status, instance (REST only), code, requestId,
        traceId (only when the request is traced), errors (always), commandId
        (only with the code COMMAND_IN_PROGRESS, naming the command in
        flight). An MCP tool result marked as an error carries the same object
        without instance.
      required: [type, title, status, code, requestId, errors]
      properties:
        type:
          type: string
          pattern: '^urn:webblock:problem:[a-z0-9-]+$'
          description: >-
            urn:webblock:problem: followed by the code in lower case with each
            underscore replaced by a hyphen; one URN per code. An identifier,
            not a page.
        title:
          type: string
          maxLength: 500
          description: The code's fixed message; it never depends on the request.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status of the response; the same number on MCP.
        instance:
          type: string
          description: >-
            REST only: the request path without the query string, as a URI
            reference (percent-encoded). Absent on MCP.
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,99}$'
          description: >-
            Stable machine-readable error code in UPPER_SNAKE, listed with
            each error response.
        requestId: { $ref: '#/components/schemas/RequestId' }
        traceId: { $ref: '#/components/schemas/TraceId' }
        errors:
          type: array
          maxItems: 10
          description: >-
            One entry per bad input of a 400 VALIDATION_FAILED; empty for
            every other error.
          items: { $ref: '#/components/schemas/FieldError' }
        commandId: { $ref: '#/components/schemas/Uuid' }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
          maxLength: 100
          description: >-
            The input's name as the client sends it: on REST projectId,
            releaseId, commandId, Idempotency-Key, Content-Length, body or
            query; on MCP the tool argument, arguments for an unknown one, a
            refused header or body.
        code:
          type: string
          enum: [REQUIRED, INVALID_FORMAT, OUT_OF_RANGE, TOO_LONG]
        message:
          type: string
          maxLength: 200
          description: The code's fixed message; never the value sent.
    ReleaseStatus:
      type: string
      enum: [accepted, building, built, candidate_ready, promoting, live, superseded, failed, rolled_back]
    ReleaseStepName:
      type: string
      enum: [build, access_setup, candidate, promotion, observation, rollback]
    ReleaseStepStatus:
      type: string
      enum: [pending, running, succeeded, failed]
    RoutingStatus:
      type: string
      enum: [stable, changing, uncertain]
    HostingStatus:
      type: string
      enum: [online, offline]
    CommandKind:
      type: string
      enum: [deploy, promote, rollback, suspend_hosting, resume_hosting, redeploy]
    CommandStatus:
      type: string
      enum: [accepted, running, succeeded, failed, skipped]
    CommandAccepted:
      type: object
      additionalProperties: false
      required: [commandId, status, statusUrl]
      properties:
        commandId: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/CommandStatus' }
        statusUrl:
          type: string
          maxLength: 300
          description: Relative path of get_command for this command.
    CommandSummary:
      type: object
      additionalProperties: false
      description: >-
        The identity and progress of a command, without its target. Read the
        whole command with get_command.
      required: [commandId, kind, status]
      properties:
        commandId: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/CommandKind' }
        status: { $ref: '#/components/schemas/CommandStatus' }
    ReleaseStep:
      type: object
      additionalProperties: false
      required: [stepName, attempt, status]
      properties:
        stepName: { $ref: '#/components/schemas/ReleaseStepName' }
        attempt:
          type: integer
          minimum: 1
          maximum: 2147483647
        status: { $ref: '#/components/schemas/ReleaseStepStatus' }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        finishedAt: { $ref: '#/components/schemas/Timestamp' }
        deadlineAt: { $ref: '#/components/schemas/Timestamp' }
        failureCode:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z][a-z0-9_]{0,99}$'
        failureRetryable:
          type: boolean
          description: >-
            Present exactly when failureCode is: whether a new deploy or build of the
            same input may succeed without a code or configuration change (the
            failure-code catalogue, .claude/docs/runbooks/failure-codes.md). False for a
            code the catalogue does not list.
    Release:
      type: object
      additionalProperties: false
      description: >-
        One attempt to build and publish one accepted source commit. The
        source fields never change after acceptance.
      required: [releaseId, projectId, generationRequestId, repositoryId, gitCommitSha, status, steps, createdAt, updatedAt]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        generationRequestId: { $ref: '#/components/schemas/Uuid' }
        repositoryId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: GitHub repository ID of the accepted source.
        gitCommitSha:
          type: string
          minLength: 40
          maxLength: 64
          pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'
          description: Exact accepted commit, 40 or 64 lowercase hexadecimal characters; never a branch or an abbreviated SHA.
        containerImageDigest:
          type: string
          maxLength: 71
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Bare digest, present from status built onward; the registry location is derived from trusted configuration.
        status: { $ref: '#/components/schemas/ReleaseStatus' }
        failureCode:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z][a-z0-9_]{0,99}$'
          description: Present exactly when status is failed or rolled_back.
        failureRetryable:
          type: boolean
          description: >-
            Present exactly when failureCode is: whether a new deploy or build of the
            same input may succeed without a code or configuration change (the
            failure-code catalogue, .claude/docs/runbooks/failure-codes.md). False for a
            code the catalogue does not list.
        failureSummary:
          type: string
          maxLength: 500
        steps:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ReleaseStep' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        promotedAt: { $ref: '#/components/schemas/Timestamp' }
    Command:
      type: object
      additionalProperties: false
      description: >-
        An accepted command. releaseId is present exactly when kind is deploy,
        redeploy, promote or rollback; a suspend_hosting or resume_hosting command acts
        on the project and names no release. The command's idempotency key is
        never returned.
      required: [commandId, projectId, kind, commandNumber, status, createdAt, updatedAt]
      properties:
        commandId: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        releaseId: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/CommandKind' }
        commandNumber: { $ref: '#/components/schemas/CommandNumber' }
        status: { $ref: '#/components/schemas/CommandStatus' }
        failureCode:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z][a-z0-9_]{0,99}$'
          description: Present exactly when status is failed or skipped.
        failureRetryable:
          type: boolean
          description: >-
            Present exactly when failureCode is: whether a new deploy or build of the
            same input may succeed without a code or configuration change (the
            failure-code catalogue, .claude/docs/runbooks/failure-codes.md). False for a
            code the catalogue does not list.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AdminCommand:
      type: object
      additionalProperties: false
      description: >-
        A command as the admin read shows it (decision 0023 G9): the Command
        fields and requestedBySubject, the subject that asked for it (an
        admin's or a client's), absent for a command from an event. No client
        operation returns it. The idempotency key is never returned.
      required: [commandId, projectId, kind, commandNumber, status, createdAt, updatedAt]
      properties:
        commandId: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        releaseId: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/CommandKind' }
        commandNumber: { $ref: '#/components/schemas/CommandNumber' }
        status: { $ref: '#/components/schemas/CommandStatus' }
        failureCode:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z][a-z0-9_]{0,99}$'
          description: Present exactly when status is failed or skipped.
        failureRetryable:
          type: boolean
          description: >-
            Present exactly when failureCode is: whether a new deploy or build of the
            same input may succeed without a code or configuration change (the
            failure-code catalogue, .claude/docs/runbooks/failure-codes.md). False for a
            code the catalogue does not list.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        requestedBySubject:
          type: string
          minLength: 1
          maxLength: 255
          description: The token subject that asked for the command; absent for a command from an event.
    Deployment:
      type: object
      additionalProperties: false
      description: >-
        The project's stored hosting state. liveReleaseId is the last
        release confirmed live and is absent before the first one; it stays set
        while hosting is offline. inFlightCommand summarizes the project's
        command in flight (accepted or running) and is absent when there is
        none; it may be a hosting command created from a Payment event.
      required: [projectId, lastCommandNumber, routingStatus, hostingStatus, updatedAt]
      properties:
        projectId: { $ref: '#/components/schemas/Uuid' }
        liveReleaseId: { $ref: '#/components/schemas/Uuid' }
        lastCommandNumber: { $ref: '#/components/schemas/LastCommandNumber' }
        routingStatus: { $ref: '#/components/schemas/RoutingStatus' }
        hostingStatus: { $ref: '#/components/schemas/HostingStatus' }
        inFlightCommand: { $ref: '#/components/schemas/CommandSummary' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ReleaseSummary:
      type: object
      additionalProperties: false
      description: A release without its steps, as list_releases returns it.
      required: [releaseId, projectId, gitCommitSha, status, createdAt, updatedAt]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        gitCommitSha:
          type: string
          minLength: 40
          maxLength: 64
          pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'
        containerImageDigest:
          type: string
          maxLength: 71
          pattern: '^sha256:[0-9a-f]{64}$'
        status: { $ref: '#/components/schemas/ReleaseStatus' }
        failureCode:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z][a-z0-9_]{0,99}$'
        failureRetryable:
          type: boolean
          description: >-
            Present exactly when failureCode is: whether a new deploy or build of the
            same input may succeed without a code or configuration change (the
            failure-code catalogue, .claude/docs/runbooks/failure-codes.md). False for a
            code the catalogue does not list.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        promotedAt: { $ref: '#/components/schemas/Timestamp' }
    Cursor:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^[A-Za-z0-9_-]+$'
    DiagnosticRelease:
      type: object
      additionalProperties: false
      description: The release's own state; its failure text is left out (read it with get_release).
      required: [status, createdAt, updatedAt]
      properties:
        status: { $ref: '#/components/schemas/ReleaseStatus' }
        failureCode:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z][a-z0-9_]{0,99}$'
        failureRetryable:
          type: boolean
          description: >-
            Present exactly when failureCode is: whether a new deploy or build of the
            same input may succeed without a code or configuration change (the
            failure-code catalogue, .claude/docs/runbooks/failure-codes.md). False for a
            code the catalogue does not list.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        promotedAt: { $ref: '#/components/schemas/Timestamp' }
    SourceEventOutcome:
      type: object
      additionalProperties: false
      description: >-
        What became of the "source published" event the release was accepted
        from: its status, the outcome code of a rejected or failed event, the
        processing attempts, how many later events with the same key named
        another repository or commit, and the times. No repository, commit or
        payload.
      required: [status, attempts, mismatchedRepeatCount, receivedAt]
      properties:
        status:
          type: string
          enum: [pending, accepted, rejected, failed]
        outcomeCode:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z][a-z0-9_]{0,99}$'
        attempts:
          type: integer
          minimum: 0
          maximum: 2147483647
        mismatchedRepeatCount:
          type: integer
          minimum: 0
          maximum: 2147483647
        receivedAt: { $ref: '#/components/schemas/Timestamp' }
        finishedAt: { $ref: '#/components/schemas/Timestamp' }
    Diagnostics:
      type: object
      additionalProperties: false
      description: >-
        Bounded and redacted: codes, counts and times from the stored rows,
        never a log location, failure text, token, credential, source or
        customer content. sourceEvent is absent when no event row is found
        for the release.
      required: [releaseId, projectId, release, steps, stepsTruncated, commands, commandsTruncated]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        release: { $ref: '#/components/schemas/DiagnosticRelease' }
        steps:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ReleaseStep' }
        stepsTruncated:
          type: boolean
        commands:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Command' }
        commandsTruncated:
          type: boolean
        sourceEvent: { $ref: '#/components/schemas/SourceEventOutcome' }
    NullValue:
      description: >-
        The JSON null. Written so that OpenAPI 3.0 readers and JSON Schema
        validators both accept exactly null.
      nullable: true
      enum: [null]
    Page:
      type: object
      additionalProperties: false
      description: >-
        One page of a list (decision 0023 G4): the limit it was read with and
        the cursor of the next page, null on the last page.
      required: [limit, nextCursor]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 50
        nextCursor:
          anyOf:
            - $ref: '#/components/schemas/Cursor'
            - $ref: '#/components/schemas/NullValue'
    Meta:
      type: object
      additionalProperties: false
      description: >-
        The meta of a success (Notion 2.1, decision 0023 G2). page is null:
        only a list has a page.
      required: [requestId, timestamp, path, status, page]
      properties:
        requestId: { $ref: '#/components/schemas/RequestId' }
        traceId: { $ref: '#/components/schemas/TraceId' }
        timestamp: { $ref: '#/components/schemas/MetaTimestamp' }
        path: { $ref: '#/components/schemas/MetaPath' }
        status: { $ref: '#/components/schemas/SuccessStatus' }
        page: { $ref: '#/components/schemas/NullValue' }
    ListMeta:
      type: object
      additionalProperties: false
      description: The meta of a list, the same as Meta but with its page.
      required: [requestId, timestamp, path, status, page]
      properties:
        requestId: { $ref: '#/components/schemas/RequestId' }
        traceId: { $ref: '#/components/schemas/TraceId' }
        timestamp: { $ref: '#/components/schemas/MetaTimestamp' }
        path: { $ref: '#/components/schemas/MetaPath' }
        status: { $ref: '#/components/schemas/SuccessStatus' }
        page: { $ref: '#/components/schemas/Page' }
    TraceId:
      type: string
      pattern: '^[0-9a-f]{32}$'
      description: The trace of the request; present only when it was sampled.
    MetaTimestamp:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$'
      description: When the answer was made, in UTC with milliseconds.
    MetaPath:
      type: string
      description: >-
        The request path without the query string, as a URI reference
        (percent-encoded).
    SuccessStatus:
      type: integer
      minimum: 200
      maximum: 299
      description: The HTTP status of the response.
    Success:
      type: boolean
      enum: [true]
    CommandAcceptedResponse:
      type: object
      additionalProperties: false
      required: [success, data, meta]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data: { $ref: '#/components/schemas/CommandAccepted' }
        meta: { $ref: '#/components/schemas/Meta' }
    ReleaseResponse:
      type: object
      additionalProperties: false
      required: [success, data, meta]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data: { $ref: '#/components/schemas/Release' }
        meta: { $ref: '#/components/schemas/Meta' }
    CommandResponse:
      type: object
      additionalProperties: false
      required: [success, data, meta]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data: { $ref: '#/components/schemas/Command' }
        meta: { $ref: '#/components/schemas/Meta' }
    DeploymentResponse:
      type: object
      additionalProperties: false
      required: [success, data, meta]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data: { $ref: '#/components/schemas/Deployment' }
        meta: { $ref: '#/components/schemas/Meta' }
    DiagnosticsResponse:
      type: object
      additionalProperties: false
      required: [success, data, meta]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data: { $ref: '#/components/schemas/Diagnostics' }
        meta: { $ref: '#/components/schemas/Meta' }
    ReleaseListResponse:
      type: object
      additionalProperties: false
      required: [success, data, meta]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ReleaseSummary' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    CommandListResponse:
      type: object
      additionalProperties: false
      required: [success, data, meta]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Command' }
        meta: { $ref: '#/components/schemas/ListMeta' }
    AdminCommandListResponse:
      type: object
      additionalProperties: false
      required: [success, data, meta]
      properties:
        success: { $ref: '#/components/schemas/Success' }
        data:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AdminCommand' }
        meta: { $ref: '#/components/schemas/ListMeta' }
