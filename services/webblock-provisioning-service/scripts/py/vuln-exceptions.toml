# Reviewed, time-bounded exceptions of make py-vuln (scripts/py/vuln.py; CLAUDE.md section 4).
# A finding of osv-scanner on uv.lock fails the gate unless one entry here names it exactly.
#
# Each entry needs every field. version is the locked version, so an upgrade ends the exception.
# expires is an unquoted date, valid through that day and at most 30 days ahead; an expired entry
# fails the gate whether or not it still matches, and an entry that matches nothing is reported for
# removal. Use one entry per advisory id the scanner prints (an advisory and its aliases are listed
# separately).
#
# [[exception]]
# package = "example"
# version = "1.2.3"
# vulnerability = "GHSA-xxxx-xxxx-xxxx"
# reason = "why the finding is acceptable for now"
# reviewer = "who reviewed it"
# expires = 2026-11-30
# follow_up = "what removes the need, and who does it"
#
# Only the lead adds one, after the owner signs it.

# certifi 2026.7.22 still trusts the emSign root CAs (compromised intermediate keys). The fix,
# certifi 2026.10.19, was uploaded on 2026-10-20T02:24Z, so under the 14-day rule it may be locked
# from 2026-11-03 on. Recorded 24 October 2026.

[[exception]]
package = "certifi"
version = "2026.7.22"
vulnerability = "PYSEC-2026-4320"
reason = "No fixed certifi is 14 days old yet (2026.10.19 uploaded 2026-10-20; 2026.10.23 is younger). Exposure is small: only the Sentry SDK reads the certifi bundle (sentry_sdk/transport.py uses certifi.where() unless SSL_CERT_FILE is set, and src/provisioning/infrastructure/telemetry/sentry.py passes no ca_certs). The Kubernetes client trusts the cluster CA from the kubeconfig or the service account, and the JWKS fetch uses the system roots (identity/verifier.py), so neither reads certifi. requests is now also a runtime dependency through the OTLP/HTTP trace exporter (decision 0022 E9; opentelemetry-exporter-otlp-proto-http in uv.lock), which reads the certifi bundle when OTEL_EXPORTER_OTLP_ENDPOINT is an https URL and no CA file is set. Tracing is off by default (endpoint unset or none), so with the default configuration the exposure is unchanged; with tracing on, someone on the network path holding a certificate from a compromised emSign intermediate could read or forge the trace spans sent to the collector (span names, IDs, durations; no token, credential or body). Impact if abused (Sentry): someone on the network path who holds a certificate from a compromised emSign intermediate could read or forge the scrubbed error events sent to Sentry; no token, credential or command goes that way."
reviewer = "lead, under the owner's 14-day rule; signed by the owner (roa) on 24 October 2026 for the earlier text; exposure updated by the lead on 24 October 2026 (Phase B, tracing exporter), owner re-sign pending"
expires = 2026-11-03
follow_up = "On 2026-11-03, lock certifi 2026.10.19 or a newer fixed release that is 14 days old (uv lock --upgrade-package certifi==<ver>, moving exclude-newer as needed) and delete both certifi entries. Lead does it."

[[exception]]
package = "certifi"
version = "2026.7.22"
vulnerability = "GHSA-6q48-6c7w-9gw2"
reason = "Alias of PYSEC-2026-4320 (same advisory, emSign roots); see that entry for the exposure. No fixed certifi is 14 days old yet (2026.10.19 uploaded 2026-10-20)."
reviewer = "lead, under the owner's 14-day rule; signed by the owner (roa) on 24 October 2026 for the earlier text; exposure updated by the lead on 24 October 2026 (Phase B, tracing exporter), owner re-sign pending"
expires = 2026-11-03
follow_up = "On 2026-11-03, lock certifi 2026.10.19 or a newer fixed release that is 14 days old and delete both certifi entries. Lead does it."
