# Reviewed, time-bounded exceptions of make image-scan (scripts/py/image_scan.py; CLAUDE.md
# section 4). A High or Critical finding fails the scan unless one entry here names it exactly.
#
# Each entry needs every field. expires is an unquoted date, valid through that day and at most 30
# days ahead (decision 0016 section 9 ruling 4); an expired entry fails the scan whether or not it
# still matches, and an entry that matches nothing is reported for removal. image is a name from
# TARGETS in image_scan.py (sample-site, clothing-shop, provisioning).
#
# [[exception]]
# image = "sample-site"
# vulnerability = "CVE-YYYY-NNNNN"
# package = "libexample"
# reason = "why the finding is acceptable for now"
# reviewer = "who reviewed it"
# expires = 2026-11-30
# follow_up = "what removes the need, and who does it"
#
# Only the lead adds one, after the owner signs it.

# Provisioning service image, base-image (Debian trixie) CVEs with no fix in trixie; signed by the
# owner on 18 October 2026. Proposal and per-CVE reasons: .superpowers/sdd/python/image-exceptions-proposal.md.

[[exception]]
image = "provisioning"
vulnerability = "CVE-2025-69720"
package = "libncursesw6"
reason = "Stack buffer overflow in the infocmp tool (ncurses before 6.5-20251213). The flaw is in the infocmp program from ncurses-bin; the libraries (libtinfo6, libncursesw6) do not contain it. Python loads libtinfo6 at most through the readline module; infocmp is never run. Nothing in src/provisioning starts a subprocess, and the pods run non-root with allowPrivilegeEscalation false, all capabilities dropped and a read-only root file system (deploy/helm/provisioning/templates/_helpers.tpl), so nobody can run the tool and a setuid binary gains no privilege. Impact if reachable: Memory corruption in a command-line tool, run by someone who can feed it a crafted terminfo entry; none can in the service. Debian trixie: no-dsa (minor); fixed only in forky/sid (ncurses 6.6)."
reviewer = "roa (owner), signed 18 October 2026"
expires = 2026-11-17
follow_up = "Re-check the Debian security tracker when the base image moves (python 3.14.8-slim-trixie digest, at least 14 days old, earliest 2026-10-23 if the tag was not rebuilt) and at expiry; delete the entry if the new base clears it, otherwise the owner re-signs for at most 30 days. Lead records the entry."

