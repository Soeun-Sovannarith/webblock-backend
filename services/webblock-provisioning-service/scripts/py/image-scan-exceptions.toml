[[exception]]
image = "provisioning"
vulnerability = "CVE-2026-102010"
package = "gcc-14-base"
reason = "Use-after-free in libstdc++ when code calls erase_if on a pb_ds binary-heap priority queue. This is template code compiled into the caller; the service and its pinned wheels (psycopg-binary, pydantic-core, cryptography, cffi, greenlet, yarl, multidict and the like) are C, Cython or Rust and none is known to use that container. libgcc-s1 and libstdc++6 are loaded by the Python process (not re-checked in the image: no Docker run was allowed for this task) but the vulnerable code is not called. Impact if reachable: A crash or memory corruption inside a C++ program that uses that heap; no such program here. Debian trixie: no-dsa (minor) for gcc-13 and gcc-14, ignored for gcc-12; fixed only in sid/forky."
reviewer = "roa (owner), signed 18 October 2026"
expires = 2026-11-17
follow_up = "Re-check the Debian security tracker when the base image moves (python 3.14.8-slim-trixie digest, at least 14 days old, earliest 2026-10-23 if the tag was not rebuilt) and at expiry; delete the entry if the new base clears it, otherwise the owner re-signs for at most 30 days. Lead records the entry."

