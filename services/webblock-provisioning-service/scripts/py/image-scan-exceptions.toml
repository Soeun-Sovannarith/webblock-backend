[[exception]]
image = "provisioning"
vulnerability = "CVE-2026-85091"
package = "zlib1g"
reason = "Heap overflow in zlib's gz_vacate() via gzprintf/gzvprintf after a stalled non-blocking gzwrite, in zlib 1.3.1.2 through 1.3.2. zlib1g is loaded by the Python process, but CPython's zlib module and gzip module use the deflate and inflate stream calls, not the gz* file API, and no dependency calls gzwrite. The Debian package is 1.3.dfsg+really1.3.1, which is older than the upstream 1.3.1.2 commit that introduced the bug, so the finding is likely a version-match false positive; I could not confirm this in the package source. Impact if reachable: Heap overflow in a program writing gzip files through a non-blocking descriptor with gzprintf; none here. Debian trixie: open: Debian lists it vulnerable and unfixed in every suite; no-dsa/postponed not stated."
