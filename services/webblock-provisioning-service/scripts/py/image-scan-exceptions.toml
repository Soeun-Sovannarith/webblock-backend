[[exception]]
image = "provisioning"
vulnerability = "CVE-2026-54369"
package = "libacl1"
reason = "libacl path functions follow symlinks, enabling local privilege escalation by someone who can swap a path component for a symlink. libacl1 is a dependency of coreutils and tar-class tools; the Python process does not load it and calls no ACL function. Nothing in src/provisioning starts a subprocess, and the pods run non-root with allowPrivilegeEscalation false, all capabilities dropped and a read-only root file system (deploy/helm/provisioning/templates/_helpers.tpl), so nobody can run the tool and a setuid binary gains no privilege. Impact if reachable: Local privilege escalation by a local attacker against a privileged process; the service has no local attacker and no privilege. Debian trixie: no-dsa; fixed in acl 2.4.0-1 (forky/sid), not to be backported."
reviewer = "roa (owner), signed 18 October 2026"
expires = 2026-11-17
follow_up = "Re-check the Debian security tracker when the base image moves (python 3.14.8-slim-trixie digest, at least 14 days old, earliest 2026-10-23 if the tag was not rebuilt) and at expiry; delete the entry if the new base clears it, otherwise the owner re-signs for at most 30 days. Lead records the entry."

