reason = "A local user can redirect a setuid mount(8) bind mount (restricted bind mounts take the fstab source path unpinned); with X-mount.owner/group/mode root changes the owner or mode of the redirected inode. Needs fstab entries and mount privilege; neither exists in the pod, and mount is never run. Libraries and login are listed because of the shared source package. Nothing in src/provisioning starts a subprocess, and the pods run non-root with allowPrivilegeEscalation false, all capabilities dropped and a read-only root file system (deploy/helm/provisioning/templates/_helpers.tpl), so nobody can run the tool and a setuid binary gains no privilege. Impact if reachable: Ownership or mode change on a host inode by a local user; no fstab, no mount. Debian trixie: no-dsa (minor); fixed in util-linux 2.42.4-1 (forky/sid)."
reviewer = "roa (owner), signed 18 October 2026"
expires = 2026-11-17
follow_up = "Re-check the Debian security tracker when the base image moves (python 3.14.8-slim-trixie digest, at least 14 days old, earliest 2026-10-23 if the tag was not rebuilt) and at expiry; delete the entry if the new base clears it, otherwise the owner re-signs for at most 30 days. Lead records the entry."

