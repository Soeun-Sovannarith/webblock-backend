[[exception]]
image = "provisioning"
vulnerability = "CVE-2026-19499"
package = "libc-bin"
reason = "Out-of-bounds write in strfmon and strfmon_l (monetary formatting) with right-justified width padding. libc6 is loaded by every process, but CPython does not call strfmon (locale.currency is Python code) and no dependency of uv.lock does. Impact if reachable: Stack or heap overwrite in a caller that passes attacker-influenced padding to strfmon; no such caller. Debian trixie: no-dsa (minor); fixed in glibc 2.43-7 (forky/sid)."
reviewer = "roa (owner), signed 18 October 2026"
expires = 2026-11-17
follow_up = "Re-check the Debian security tracker when the base image moves (python 3.14.8-slim-trixie digest, at least 14 days old, earliest 2026-10-23 if the tag was not rebuilt) and at expiry; delete the entry if the new base clears it, otherwise the owner re-signs for at most 30 days. Lead records the entry."

