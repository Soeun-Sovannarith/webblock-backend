[[exception]]
image = "provisioning"
vulnerability = "CVE-2026-76642"
package = "util-linux"
reason = "util-linux does not check the mount helper's exit status before running post-mount hooks (X-mount.idmap, X-mount.owner); an unprivileged user can escalate through mount(8). The code is in the mount program; the shared libraries (libblkid1, libmount1, libuuid1, libsmartcols1, liblastlog2-2) are listed only because they come from the same source package. The Python process may load libuuid1 for the uuid module; that library does not hold this code. mount, su and login are never run. mount needs CAP_SYS_ADMIN, which the pods drop. Nothing in src/provisioning starts a subprocess, and the pods run non-root with allowPrivilegeEscalation false, all capabilities dropped and a read-only root file system (deploy/helm/provisioning/templates/_helpers.tpl), so nobody can run the tool and a setuid binary gains no privilege. Impact if reachable: Privilege escalation for a local user through mount hooks; needs a shell, a mount capability and an fstab entry, none present. Debian trixie: no-dsa (minor); fixed in util-linux 2.42.4-1 (forky/sid)."
reviewer = "roa (owner), signed 18 October 2026"
expires = 2026-11-17
follow_up = "Re-check the Debian security tracker when the base image moves (python 3.14.8-slim-trixie digest, at least 14 days old, earliest 2026-10-23 if the tag was not rebuilt) and at expiry; delete the entry if the new base clears it, otherwise the owner re-signs for at most 30 days. Lead records the entry."

