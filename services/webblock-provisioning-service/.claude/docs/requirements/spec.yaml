# The spec register: every BR, PR, FR and TR of BRD.md, PRD.md, FRD.md and TRD.md in this folder.
# Kept by hand next to the documents; the documents stay the source of each item's text.
# Fields: id, title (short), status (current or removed), parents (BR for a PR, PR for an FR, FR for a TR),
# priority and phase (a PR's from the PRD; an FR takes its strongest PR's priority and its first PR's
# phase; a TR takes them from its FRs, and a TR serving all FRs has all_fr: true and is Must). An FR also
# lists its acceptance rows and the test node IDs that carry its ID. no_test_yet: the current Must FRs
# with no test so far. Checked by make spec-check (scripts/py/spec_check.py), which reads only a YAML
# subset: keys, lists, double-quoted strings, flow lists of plain words, comment lines.
