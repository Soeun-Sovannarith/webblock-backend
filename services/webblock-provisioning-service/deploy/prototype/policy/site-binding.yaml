# Policy webblock-site-binding (decision 0014 section 21 ruling 1; TR-35). Installed by
# deploy/kind/proto-policy.sh (make proto-policy, step 8c of make proto-up).
#
# Every per-site object the release worker writes in a tenant namespace belongs to that namespace's
# project. The namespace's project ID is read from its label websites.webblock.internal/project-id
# (namespaceObject), which only the bootstrap identity writes (webblock-bootstrap-scope and
# webblock-tenant-writer), so it is a trusted source. For the worker's CREATE and UPDATE of Deployments,
# Services and HTTPRoutes in namespaces labelled websites.webblock.internal/tenant=true:
#   - the object's label project-id equals the namespace's project ID;
#   - a Deployment's pod template carries the same project-id label (the pods are the tenant's);
#   - a Deployment or Service is named rel-<releaseId> and labelled release-id=<releaseId>
#     (render.release_name and render.release_labels).
# The renderer (src/provisioning/infrastructure/kubernetes/render.py) writes exactly this; the live
# tests admit its output and refuse a planted foreign label.
#
# Fixed messages with reason Forbidden; none contains a value from the request. failurePolicy Fail.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: webblock-site-binding
  labels:
    app.kubernetes.io/part-of: webblock-provisioning
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        websites.webblock.internal/tenant: "true"
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes"]
  matchConditions:
    - name: release-worker
      expression: "request.userInfo.username == 'system:serviceaccount:webblock:provisioning-worker'"
  variables:
    - name: nsLabels
      expression: "has(namespaceObject.metadata.labels) ? namespaceObject.metadata.labels : {}"
    - name: project
      expression: >-
        'websites.webblock.internal/project-id' in variables.nsLabels
        ? variables.nsLabels['websites.webblock.internal/project-id'] : ''
    - name: labels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
    - name: isDeployment
      expression: "request.resource.group == 'apps' && request.resource.resource == 'deployments'"
    - name: isRelease
      expression: >-
        variables.isDeployment ||
        (request.resource.group == '' && request.resource.resource == 'services')
  validations:
    - expression: >-
        variables.project != '' &&
        'websites.webblock.internal/project-id' in variables.labels &&
        variables.labels['websites.webblock.internal/project-id'] == variables.project
      reason: Forbidden
      message: "webblock-site-binding: the object's project-id label must equal its tenant namespace's project"
    - expression: >-
        !variables.isDeployment ||
        (has(object.spec.template.metadata.labels) &&
         'websites.webblock.internal/project-id' in object.spec.template.metadata.labels &&
         object.spec.template.metadata.labels['websites.webblock.internal/project-id'] == variables.project)
      reason: Forbidden
      message: "webblock-site-binding: a Deployment's pod template carries its tenant namespace's project-id label"
    - expression: >-
        !variables.isRelease ||
        ('websites.webblock.internal/release-id' in variables.labels &&
         object.metadata.name == 'rel-' + variables.labels['websites.webblock.internal/release-id'])
      reason: Forbidden
      message: "webblock-site-binding: a Deployment or Service is named rel-<releaseId> after its release-id label"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: webblock-site-binding
  labels:
    app.kubernetes.io/part-of: webblock-provisioning
spec:
  policyName: webblock-site-binding
  validationActions: ["Deny"]
