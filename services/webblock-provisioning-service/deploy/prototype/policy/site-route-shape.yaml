# Policy webblock-site-route-shape (decision 0014 section 21 ruling 1; TR-35). Installed by
# deploy/kind/proto-policy.sh.
#
# The worker's HTTPRoutes in a tenant namespace wb-<projectId> have the shape the renderer gives them
# (render_route, render_preview_route, render_redirect_route), so a worker bug or a stolen worker token
# cannot take another site's traffic or point a site somewhere else:
#   - name route-<projectId>, preview-<projectId> or redirect-<projectId> of the namespace's project;
#   - every parentRef is the shared Gateway webblock-gateway/webblock-public (no ListenerSet: the
#     platform provides no custom domains for now, owner's scope change of 9 October 2026);
#   - a route with a parent names at least one hostname (a route without hostnames would serve every
#     name under the Gateway's wildcard listeners);
#   - hostnames: <subdomain>.<siteDomain> only, and for preview-<projectId> only
#     <subdomain>-preview.<siteDomain> (decision 0023 G18; FR-20), so the older preview host
#     <subdomain>.preview.<siteDomain> is refused. siteDomain comes from the ConfigMap
#     webblock/webblock-site-policy; subdomain from the namespace label
#     websites.webblock.internal/subdomain, which only the bootstrap identity writes, from
#     project_hosting.subdomain (decision 0023 G18a), the same way it writes the project ID. A
#     namespace without the label admits no route with a parent;
#   - backends: Services only, named rel-* in the route's own namespace, or the shared offline page
#     webblock-offline/offline-page; no per-backend filters;
#   - rule filters: on route- and redirect-<projectId>, ResponseHeaderModifier (the X-Webblock-Release
#     header) and RequestRedirect, whose hostname, when set, is the project's own platform hostname;
#     on preview-<projectId>, only a ResponseHeaderModifier that sets exactly X-Webblock-Release and
#     Cache-Control: private, no-store and adds or removes nothing, so no shared cache (Cloudflare)
#     serves the candidate without the token (FR-52.1, preview-host security review M1), and a
#     RequestHeaderModifier that removes exactly X-Webblock-Preview and sets or adds nothing, so the
#     probe's token never reaches the site (decision 0023 G18c, Task 12 security review S1).
#   - preview-<projectId> matches only with its token header: every rule has matches, and each match
#     has exactly one header match, Exact on X-Webblock-Preview with a value of 32 to 256 URL-safe
#     characters, so a preview route can never be public (Task 12 security review S4). The value
#     itself is the project's HMAC token (decision 0023 G18c), which only the worker knows.
#   - preview-<projectId> must remove the token header: every rule carries exactly one
#     RequestHeaderModifier, which the filter rule above makes the removal of X-Webblock-Preview
#     (Task 12 security re-review L1).
#   - preview-<projectId> must forbid caching: every rule carries exactly one ResponseHeaderModifier,
#     which the filter rule above makes the one with Cache-Control: private, no-store (FR-52.1).
# Detached routes (no parentRefs, as the redirect route without other hostnames) are admitted.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: webblock-site-route-shape
  labels:
    app.kubernetes.io/part-of: webblock-provisioning
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    namespaceSelector:
      matchLabels:
        websites.webblock.internal/tenant: "true"
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes"]
  matchConditions:
    - name: release-worker
      expression: "request.userInfo.username == 'system:serviceaccount:webblock:provisioning-worker'"
  variables:
    - name: siteDomain
      expression: "has(params.data) && 'siteDomain' in params.data ? params.data.siteDomain : ''"
    - name: project
      expression: >-
        has(namespaceObject.metadata.labels) &&
        'websites.webblock.internal/project-id' in namespaceObject.metadata.labels
        ? namespaceObject.metadata.labels['websites.webblock.internal/project-id'] : ''
    - name: subdomain
      expression: >-
        has(namespaceObject.metadata.labels) &&
        'websites.webblock.internal/subdomain' in namespaceObject.metadata.labels
        ? namespaceObject.metadata.labels['websites.webblock.internal/subdomain'] : ''
    - name: isPreview
      expression: "object.metadata.name == 'preview-' + variables.project"
    - name: platformHost
      expression: "variables.subdomain + '.' + variables.siteDomain"
    - name: allowedHost
      expression: >-
        variables.isPreview ? variables.subdomain + '-preview.' + variables.siteDomain
        : variables.platformHost
    - name: parents
      expression: "has(object.spec.parentRefs) ? object.spec.parentRefs : []"
    - name: hostnames
      expression: "has(object.spec.hostnames) ? object.spec.hostnames : []"
    - name: rules
      expression: "has(object.spec.rules) ? object.spec.rules : []"
  validations:
    - expression: "variables.siteDomain != '' && variables.project != ''"
      reason: Forbidden
      message: "webblock-site-route-shape: the route policy has no site domain or the namespace no project"
    - expression: >-
        object.metadata.name in ['route-' + variables.project, 'preview-' + variables.project,
                                 'redirect-' + variables.project]
      reason: Forbidden
      message: "webblock-site-route-shape: an HTTPRoute is named route-, preview- or redirect-<projectId> of its namespace"
    - expression: >-
        variables.parents.all(p,
          (!has(p.group) || p.group == 'gateway.networking.k8s.io') &&
          (!has(p.kind) || p.kind == 'Gateway') &&
          has(p.namespace) && p.namespace == 'webblock-gateway' && p.name == 'webblock-public')
      reason: Forbidden
      message: "webblock-site-route-shape: an HTTPRoute attaches only to the Gateway webblock-gateway/webblock-public"
    - expression: "size(variables.parents) == 0 || size(variables.hostnames) > 0"
      reason: Forbidden
      message: "webblock-site-route-shape: an attached HTTPRoute names its hostnames"
    - expression: "size(variables.parents) == 0 || variables.subdomain != ''"
      reason: Forbidden
      message: "webblock-site-route-shape: the namespace has no sub-domain label, so no attached HTTPRoute is admitted"
    - expression: "variables.hostnames.all(h, h == variables.allowedHost)"
      reason: Forbidden
      message: "webblock-site-route-shape: an HTTPRoute serves only its project's own platform hostname (or its preview hostname)"
    - expression: >-
        variables.rules.all(r, !has(r.backendRefs) || r.backendRefs.all(b,
          (!has(b.group) || b.group == '') && (!has(b.kind) || b.kind == 'Service') &&
          (!has(b.filters) || size(b.filters) == 0) &&
          ((b.name.startsWith('rel-') && (!has(b.namespace) || b.namespace == request.namespace)) ||
           (has(b.namespace) && b.namespace == 'webblock-offline' && b.name == 'offline-page'))))
      reason: Forbidden
      message: "webblock-site-route-shape: backends are rel-* Services of the route's namespace or webblock-offline/offline-page"
    - expression: >-
        variables.rules.all(r, !has(r.filters) || r.filters.all(f,
          (!variables.isPreview && f.type in ['ResponseHeaderModifier', 'RequestRedirect'] &&
           (!has(f.requestRedirect) || !has(f.requestRedirect.hostname) ||
            f.requestRedirect.hostname == variables.platformHost)) ||
          (variables.isPreview && f.type == 'ResponseHeaderModifier' &&
           has(f.responseHeaderModifier) &&
           !has(f.responseHeaderModifier.add) && !has(f.responseHeaderModifier.remove) &&
           has(f.responseHeaderModifier.set) && size(f.responseHeaderModifier.set) == 2 &&
           f.responseHeaderModifier.set.exists_one(h, h.name == 'X-Webblock-Release') &&
           f.responseHeaderModifier.set.exists_one(h, h.name == 'Cache-Control' &&
             h.value == 'private, no-store')) ||
          (variables.isPreview && f.type == 'RequestHeaderModifier' &&
           has(f.requestHeaderModifier) &&
           !has(f.requestHeaderModifier.set) && !has(f.requestHeaderModifier.add) &&
           has(f.requestHeaderModifier.remove) &&
           f.requestHeaderModifier.remove == ['X-Webblock-Preview'])))
      reason: Forbidden
      message: "webblock-site-route-shape: rule filters are the release header, a redirect to the project's own hostname, or on a preview route the release header with Cache-Control: private, no-store and the preview header's removal"
    - expression: >-
        !variables.isPreview || (size(variables.rules) > 0 && variables.rules.all(r,
          has(r.matches) && size(r.matches) > 0 && r.matches.all(m,
            has(m.headers) && size(m.headers) == 1 && m.headers.all(h,
              (!has(h.type) || h.type == 'Exact') && h.name == 'X-Webblock-Preview' &&
              h.value.matches('^[A-Za-z0-9_-]{32,256}$')))))
      reason: Forbidden
      message: "webblock-site-route-shape: a preview route matches only with exactly one exact X-Webblock-Preview header"
    - expression: >-
        !variables.isPreview || (size(variables.rules) > 0 && variables.rules.all(r,
          has(r.filters) && r.filters.exists_one(f, f.type == 'RequestHeaderModifier')))
      reason: Forbidden
      message: "webblock-site-route-shape: every rule of a preview route removes the X-Webblock-Preview header"
    - expression: >-
        !variables.isPreview || (size(variables.rules) > 0 && variables.rules.all(r,
          has(r.filters) && r.filters.exists_one(f, f.type == 'ResponseHeaderModifier')))
      reason: Forbidden
      message: "webblock-site-route-shape: every rule of a preview route answers with Cache-Control: private, no-store"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: webblock-site-route-shape
  labels:
    app.kubernetes.io/part-of: webblock-provisioning
spec:
  policyName: webblock-site-route-shape
  validationActions: ["Deny"]
  paramRef:
    name: webblock-site-policy
    namespace: webblock
    parameterNotFoundAction: Deny
