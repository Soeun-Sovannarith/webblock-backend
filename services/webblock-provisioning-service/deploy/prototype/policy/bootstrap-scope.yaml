# Policy webblock-bootstrap-scope (decision 0014 section 17 item 3; decision 0013 section 9; review
# finding M3). Installed on the prototype stack by deploy/kind/proto-policy.sh (make proto-up).
#
# RBAC gives the tenant bootstrap identity (deploy/prototype/rbac/30-tenant-bootstrap.yaml) its verbs
# through a ClusterRoleBinding, so on its own it may patch any Namespace, create RoleBindings in any
# namespace and write a Secret named catalog-runtime anywhere. RBAC cannot limit a create by the
# object's future name or contents, so this policy does. For requests by the user
#   system:serviceaccount:webblock:tenant-bootstrap
# (and only for that user; the matchCondition names nobody else) it allows exactly the objects that
# KubernetesTenantBootstrap renders (src/provisioning/infrastructure/kubernetes/render.py):
#   - Namespaces named wb-<uuid> (lowercase project ID), labelled tenant=true, project-id equal to the
#     name's UUID, and Pod Security enforce=restricted;
#   - ResourceQuotas, LimitRanges, RoleBindings and Secrets only inside a wb-<uuid> namespace;
#   - RoleBindings whose roleRef is the ClusterRole webblock-tenant-worker and whose one subject is the
#     ServiceAccount webblock/provisioning-worker;
#   - Secrets named catalog-runtime of type Opaque;
#   - ReferenceGrants only in webblock-offline, named wb-<uuid>, from HTTPRoutes in that one namespace
#     to the Service offline-page.
# The namespace's annotation websites.webblock.internal/catalog-secret (task F2B; decision 0016 section 8
# ruling 4, amending 0014 section 24) records whether the tenant ever received its catalog Secret. The
# bootstrap may set it only to pending, and only when it creates the namespace (so a namespace that
# already exists, whose pods may hold a password, can never be marked as created from nothing), or move
# it from pending or none (a namespace from before task F2B) to delivered. Every other change is refused:
# delivered back to pending, any removal, any other value. A value left unchanged is not checked.
# The namespace's label websites.webblock.internal/subdomain (decision 0023 G18a) carries the project's
# project_hosting.subdomain, which the route-shape policy checks route hosts against. It is one DNS
# label of at most 55 characters that does not end in -preview (FR-55: <subdomain>-preview is a
# project's preview host and must stay one label); the bootstrap may set it when it creates the
# namespace, or add it once to a namespace that has none (one from before the label). Changing or
# removing it is refused: the sub-domain is set once in the database too. A value left unchanged is
# not checked.
# Every other write by that identity is refused: any DELETE or CONNECT, any subresource, any other
# resource, and updates of objects outside the scope above. Reads are not admission requests; RBAC
# limits them. The policy does not limit cluster administrators or any other identity.
#
# Every validation has a short fixed message and reason Forbidden; no message contains a value from
# the request. failurePolicy Fail: a validation that cannot be evaluated refuses.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: webblock-bootstrap-scope
  labels:
    app.kubernetes.io/part-of: webblock-provisioning
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["*"]
        resources: ["*/*"]  # every resource and every subresource
        scope: "*"
  matchConditions:
    - name: tenant-bootstrap-identity
      expression: "request.userInfo.username == 'system:serviceaccount:webblock:tenant-bootstrap'"
  variables:
    - name: tenantName
      expression: "'^wb-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'"
    - name: writes
      expression: "request.operation == 'CREATE' || request.operation == 'UPDATE'"
    - name: isNamespace
      expression: "request.resource.group == '' && request.resource.resource == 'namespaces'"
    - name: isQuotaOrLimits
      expression: "request.resource.group == '' && request.resource.resource in ['resourcequotas', 'limitranges']"
    - name: isRoleBinding
      expression: "request.resource.group == 'rbac.authorization.k8s.io' && request.resource.resource == 'rolebindings'"
    - name: isSecret
      expression: "request.resource.group == '' && request.resource.resource == 'secrets'"
    - name: isReferenceGrant
      expression: "request.resource.group == 'gateway.networking.k8s.io' && request.resource.resource == 'referencegrants'"
    - name: labels
      expression: >-
        variables.writes && variables.isNamespace && has(object.metadata.labels)
        ? object.metadata.labels : {}
    - name: markKey
      expression: "'websites.webblock.internal/catalog-secret'"
    - name: newMark
      expression: >-
        variables.writes && variables.isNamespace && has(object.metadata.annotations) &&
        variables.markKey in object.metadata.annotations
        ? object.metadata.annotations[variables.markKey] : '<none>'
    - name: oldMark
      expression: >-
        variables.writes && variables.isNamespace && oldObject != null &&
        has(oldObject.metadata.annotations) && variables.markKey in oldObject.metadata.annotations
        ? oldObject.metadata.annotations[variables.markKey] : '<none>'
    - name: subdomainKey
      expression: "'websites.webblock.internal/subdomain'"
    - name: newSubdomain
      expression: >-
        variables.subdomainKey in variables.labels ? variables.labels[variables.subdomainKey] : '<none>'
    - name: oldSubdomain
      expression: >-
        variables.writes && variables.isNamespace && oldObject != null &&
        has(oldObject.metadata.labels) && variables.subdomainKey in oldObject.metadata.labels
        ? oldObject.metadata.labels[variables.subdomainKey] : '<none>'
  validations:
    - expression: "variables.writes && (!has(request.subResource) || request.subResource == '')"
      reason: Forbidden
      message: "webblock-bootstrap-scope: tenant bootstrap only creates and updates objects; no delete, connect or subresource"
    - expression: >-
        variables.isNamespace || variables.isQuotaOrLimits || variables.isRoleBinding ||
        variables.isSecret || variables.isReferenceGrant
      reason: Forbidden
      message: "webblock-bootstrap-scope: tenant bootstrap writes only namespaces, quotas, limits, RoleBindings, Secrets and ReferenceGrants"
    - expression: >-
        !(variables.isQuotaOrLimits || variables.isRoleBinding || variables.isSecret) ||
        request.namespace.matches(variables.tenantName)
      reason: Forbidden
      message: "webblock-bootstrap-scope: quotas, limits, RoleBindings and Secrets only in a namespace named wb-<projectId>"
    - expression: "!variables.isReferenceGrant || request.namespace == 'webblock-offline'"
      reason: Forbidden
      message: "webblock-bootstrap-scope: ReferenceGrants only in webblock-offline"
    - expression: "!(variables.writes && variables.isNamespace) || object.metadata.name.matches(variables.tenantName)"
      reason: Forbidden
      message: "webblock-bootstrap-scope: namespaces only named wb-<projectId> (a lowercase UUID)"
    - expression: >-
        !(variables.writes && variables.isNamespace) ||
        ('websites.webblock.internal/tenant' in variables.labels &&
         variables.labels['websites.webblock.internal/tenant'] == 'true' &&
         'websites.webblock.internal/project-id' in variables.labels &&
         'wb-' + variables.labels['websites.webblock.internal/project-id'] == object.metadata.name &&
         'pod-security.kubernetes.io/enforce' in variables.labels &&
         variables.labels['pod-security.kubernetes.io/enforce'] == 'restricted')
      reason: Forbidden
      message: "webblock-bootstrap-scope: a tenant namespace keeps tenant=true, project-id equal to its name and Pod Security enforce=restricted"
    - expression: >-
        !(variables.writes && variables.isNamespace) ||
        variables.newMark == variables.oldMark ||
        (request.operation == 'CREATE' && variables.newMark == 'pending') ||
        (request.operation == 'UPDATE' && variables.oldMark in ['<none>', 'pending'] &&
         variables.newMark == 'delivered')
      reason: Forbidden
      message: "webblock-bootstrap-scope: the catalog-secret mark is set to pending only on creation, then only to delivered, never back"
    - expression: >-
        !(variables.writes && variables.isNamespace) ||
        variables.newSubdomain == variables.oldSubdomain ||
        (variables.oldSubdomain == '<none>' &&
         variables.newSubdomain.matches('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$') &&
         !variables.newSubdomain.endsWith('-preview') &&
         size(variables.newSubdomain) <= 55)
      reason: Forbidden
      message: "webblock-bootstrap-scope: the sub-domain label is one DNS label of at most 55 characters, not ending in -preview, set once, never changed or removed"
    - expression: >-
        !(variables.writes && variables.isRoleBinding) ||
        (object.roleRef.apiGroup == 'rbac.authorization.k8s.io' &&
         object.roleRef.kind == 'ClusterRole' &&
         object.roleRef.name == 'webblock-tenant-worker')
      reason: Forbidden
      message: "webblock-bootstrap-scope: RoleBindings only to the ClusterRole webblock-tenant-worker"
    - expression: >-
        !(variables.writes && variables.isRoleBinding) ||
        (has(object.subjects) && size(object.subjects) == 1 &&
         object.subjects[0].kind == 'ServiceAccount' &&
         object.subjects[0].name == 'provisioning-worker' &&
         has(object.subjects[0].namespace) && object.subjects[0].namespace == 'webblock')
      reason: Forbidden
      message: "webblock-bootstrap-scope: the only RoleBinding subject is the ServiceAccount webblock/provisioning-worker"
    - expression: >-
        !(variables.writes && variables.isSecret) ||
        (object.metadata.name == 'catalog-runtime' && has(object.type) && object.type == 'Opaque')
      reason: Forbidden
      message: "webblock-bootstrap-scope: Secrets only named catalog-runtime, of type Opaque"
    - expression: >-
        !(variables.writes && variables.isReferenceGrant) ||
        (object.metadata.name.matches(variables.tenantName) &&
         has(object.spec.from) && size(object.spec.from) == 1 &&
         object.spec.from[0].group == 'gateway.networking.k8s.io' &&
         object.spec.from[0].kind == 'HTTPRoute' &&
         object.spec.from[0].namespace == object.metadata.name &&
         has(object.spec.to) && size(object.spec.to) == 1 &&
         object.spec.to[0].group == '' &&
         object.spec.to[0].kind == 'Service' &&
         has(object.spec.to[0].name) && object.spec.to[0].name == 'offline-page')
      reason: Forbidden
      message: "webblock-bootstrap-scope: a ReferenceGrant only lets the HTTPRoutes of its own wb-<projectId> namespace reach offline-page"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: webblock-bootstrap-scope
  labels:
    app.kubernetes.io/part-of: webblock-provisioning
spec:
  policyName: webblock-bootstrap-scope
  validationActions: ["Deny"]
