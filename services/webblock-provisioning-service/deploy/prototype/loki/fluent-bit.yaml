# The log shipper of the prototype stack (decision 0014 section 23 item 5): Fluent Bit tails the JSON log
# files of the Provisioning processes and pushes them to Loki (loki.yaml).
#
# The processes run on the host (scripts/prototype/run-provisioning.sh) and write
#   bin/kind-state/proto/provisioning/logs/<UTC timestamp>/<process>.log
# one JSON object per line. deploy/kind/proto-loki.sh mounts that logs folder read-only at /logs (and a
# state folder at /state for the read positions), so every run folder, present or future, is read;
# logs/latest is a link to the newest run and is excluded, or each line would be read twice.
#
# Each line becomes one Loki entry, the JSON object unchanged (line_format json), in the stream
#   {job="webblock-provisioning", process="<process>", run="<UTC timestamp>"}
# taken from the file's path. A line that is not JSON (a traceback, say) is kept as {"log": "<line>"}.
# Audit events are found with LogQL: {job="webblock-provisioning"} | json | audit="true"
# (deploy/kind/proto-loki-query.sh, make proto-logs).
service:
  flush: 1
  log_level: warn
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020
  health_check: on

parsers:
  - name: webblock_json
    format: json
  - name: webblock_log_path
    format: regex
    regex: '^/logs/(?<wb_run>[^/]+)/(?<wb_process>[A-Za-z0-9_-]+)\.log$'

pipeline:
  inputs:
    - name: tail
      tag: provisioning
      path: /logs/*/*.log
      exclude_path: /logs/latest/*
      path_key: wb_file
      parser: webblock_json
      db: /state/tail.db
      read_from_head: true
      refresh_interval: 1
      skip_long_lines: on
      mem_buf_limit: 16MB

  filters:
    - name: parser
      match: provisioning
      key_name: wb_file
      parser: webblock_log_path
      reserve_data: on

  outputs:
    - name: loki
      match: provisioning
      host: webblock-loki
      port: 3100
      labels: job=webblock-provisioning, process=$wb_process, run=$wb_run
      remove_keys: wb_process, wb_run
      line_format: json
      retry_limit: 10
