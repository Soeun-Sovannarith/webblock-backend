# The wildcard certificate of the platform subdomains (task T1; decision 0014 section 16): one
# certificate for *.sites.webblock.test from the local CA, served by the Gateway's HTTPS listener
# https-sites for every project's <subdomain>.sites.webblock.test and its preview host
# <subdomain>-preview.sites.webblock.test (FR-20, TR-45): a wildcard covers one label, and the
# preview host is one label under the site domain. A platform object in webblock-gateway;
# Provisioning never writes it. In production it is DNS-01 by the platform's cert-manager with
# infrastructure's DNS credential (review-k8s-nocp.md H4, K4).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sites-wildcard
  namespace: webblock-gateway
spec:
  secretName: sites-wildcard-tls
  commonName: "*.sites.webblock.test"
  dnsNames:
    - "*.sites.webblock.test"
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: webblock-local-ca
