# The Gateway's namespace (decision 0009 section 2), applied first so the wildcard Certificate can be
# issued before the Gateway's HTTPS listener names its Secret.
apiVersion: v1
kind: Namespace
metadata:
  name: webblock-gateway
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
