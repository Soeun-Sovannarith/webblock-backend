# Sample website, variant "preview-only" (task T2, the missing end-to-end case): up (/healthz 200,
# / 200 with its version), and ready (/readyz 200) only when the request names a preview hostname
# (Host <subdomain>-preview.<site domain>, FR-20); every other host gets 503 on /readyz. A candidate built
# from it passes its preview probe, and then fails the probe of the site's own hostname after the
# switch, so the promotion restores the route to the live release and the candidate ends
# rolled_back (site_not_answering), like a generated site that works only under the name it was
# tested with.
server {
    listen       8080;
    server_name  localhost;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /readyz {
        default_type text/plain;
        if ($host ~ "^[^.]+-preview\.") {
            return 200 "ready\n";
        }
        return 503 "not ready\n";
    }
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}
