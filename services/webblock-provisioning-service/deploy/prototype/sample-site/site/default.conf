# Sample website, variant "site": the readiness contract of decision 0014 section 15.
# /healthz answers 200 while the process is up; /readyz answers 200 because the static site has no
# dependency; every other path is served from the document root.
server {
    listen       8080;
    server_name  localhost;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /readyz {
        default_type text/plain;
        return 200 "ready\n";
    }
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}
