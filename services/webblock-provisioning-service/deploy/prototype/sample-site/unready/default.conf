# Sample website, variant "unready": up (/healthz 200, / 200 with its version) but never ready
# for traffic (/readyz 503), like a generated site whose catalog cannot be reached (decision 0014
# section 15). Kubernetes readiness passes, so the candidate becomes candidate_ready; the promotion
# probe then fails and the route goes back to the live release.
server {
    listen       8080;
    server_name  localhost;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /readyz {
        default_type text/plain;
        return 503 "not ready\n";
    }
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}
