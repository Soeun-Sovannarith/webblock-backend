# The tenant bootstrap identity (decision 0014 section 3): it alone creates a tenant namespace
# wb-<projectId>, its ResourceQuota and LimitRange, the worker's RoleBinding, the ReferenceGrant that
# lets the tenant's HTTPRoute point at the shared offline page, and access_setup's Secret catalog-runtime
# (decision 0014 section 14). It deletes nothing.
#
# RoleBindings: Kubernetes lets a subject create a RoleBinding to a role only when it holds every
# permission of that role or has the "bind" verb on it. Bootstrap holds "bind" on webblock-tenant-worker
# alone, and none of the worker's permissions, so the only role it can grant is webblock-tenant-worker
# (or a role whose rules are a subset of bootstrap's own, which no shipped role is). RBAC cannot check
# the binding's subject, the namespace's name or labels, or where an object is created; the admission
# policy webblock-bootstrap-scope (deploy/prototype/policy, 0014 section 17 item 3) does.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webblock-tenant-bootstrap
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "patch"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["create", "get", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "get", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["webblock-tenant-worker"]
    verbs: ["bind"]
  # access_setup's Secret (decision 0014 section 14): only the Secret named catalog-runtime, written by
  # server-side apply (a PATCH, which the API server also authorizes as create when the Secret is new,
  # with the name in the request) and read to decide create-or-verify. No list or watch, so bootstrap
  # cannot enumerate Secrets, and no other name. The worker has no Secret access at all
  # (20-tenant-worker.yaml); its Deployments name the Secret in envFrom and the kubelet reads it.
  # The ClusterRoleBinding below makes this valid in every namespace; webblock-bootstrap-scope admits
  # catalog-runtime (type Opaque) only in wb-<projectId> namespaces.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["catalog-runtime"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webblock-tenant-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: webblock-tenant-bootstrap
subjects:
  - kind: ServiceAccount
    name: tenant-bootstrap
    namespace: webblock
---
# ReferenceGrants only in webblock-offline: one per tenant, from that tenant's HTTPRoutes to the
# Service offline-page.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webblock-offline-grants
  namespace: webblock-offline
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["referencegrants"]
    verbs: ["create", "get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-bootstrap-offline-grants
  namespace: webblock-offline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webblock-offline-grants
subjects:
  - kind: ServiceAccount
    name: tenant-bootstrap
    namespace: webblock
