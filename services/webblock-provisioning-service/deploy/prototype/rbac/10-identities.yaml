# The two cluster identities of Provisioning (decision 0014 section 3). On the host (make proto-run),
# proto-up (deploy/kind/proto-tokens.sh) mints a 24-hour TokenRequest token for each and writes
# bin/kind-state/proto/worker.kubeconfig and bootstrap.kubeconfig. In the cluster (PROV_MODE=cluster,
# task PK), the chart deploy/helm/provisioning runs the worker and the bootstrap under these accounts
# with an explicitly projected token that expires after 600 s (decision 0016 section 9 ruling 2); it
# names them and never creates them. automountServiceAccountToken stays false.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provisioning-worker
  namespace: webblock
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-bootstrap
  namespace: webblock
automountServiceAccountToken: false
