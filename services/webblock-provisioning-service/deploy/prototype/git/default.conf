# webblock-git: serves the bare repositories of bin/kind-state/proto/git/ read-only over Git's "dumb"
# HTTP protocol (static files; scripts/prototype/sample-repo.sh runs git update-server-info after each
# push). Reachable as http://webblock-git:8080/<name>.git from containers on the kind Docker network
# (Jenkins); not published on the host. Test and demo source only.
server {
  listen 8080 default_server;
  server_name _;
  server_tokens off;
  root /srv/git;
  autoindex off;
  location / {
    limit_except GET HEAD { deny all; }
    try_files $uri =404;
  }
}
