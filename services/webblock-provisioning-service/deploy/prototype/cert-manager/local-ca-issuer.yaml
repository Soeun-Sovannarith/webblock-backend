# ClusterIssuer webblock-local-ca (task T1; decision 0014 section 16): signs every certificate on the
# prototype stack, the Gateway's wildcard certificate and the per-project Certificates the worker
# writes for purchased domains. It stands in for the production ACME CA (OD-58); prototype only
# (.claude/docs/architecture/prototype-stand-ins.md).
#
# Its key pair is the Secret webblock-local-ca in namespace cert-manager, written by
# deploy/kind/proto-certs.sh from bin/kind-state/proto/local-ca/ (generated at the first proto-up and
# kept between stacks; the key leaves that folder only into this Secret). The CA certificate is
# name-constrained to the reserved top-level domain .test, so a client that trusts
# bin/kind-state/proto/local-ca.crt trusts it for nothing else.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: webblock-local-ca
spec:
  ca:
    secretName: webblock-local-ca
