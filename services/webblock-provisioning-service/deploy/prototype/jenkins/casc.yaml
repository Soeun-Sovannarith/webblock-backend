# Configuration as code of the local Jenkins controller (decision 0014, owner answer 3). Local
# prototype only: the owner's dedicated Jenkins server has its own configuration.
#
# Secrets: the two passwords come from files in /run/secrets (JCasC's Docker secret source), mounted
# read-only from bin/kind-state/proto/jenkins-secrets/, where proto-up generates them. Provisioning
# never uses a password: proto-up logs in once as "provisioning", creates an API token, and writes it
# to bin/kind-state/proto/jenkins.env.
#
# Builds: two executors on the built-in node, so at most two builds run at once and the rest queue.
# Quiet period 0, so a triggered build is queued at once (identical parameter sets that are both still
# in the queue are merged by Jenkins into one item; Provisioning's find() covers that case).
# Authorization: any logged-in user may do anything. Prototype only; the provisioning user should be
# limited to Job/Build and Job/Read on webblock-site-build, which needs the matrix-auth plugin.
jenkins:
  systemMessage: "WebBlock prototype build server (local Docker, decision 0014)"
  numExecutors: 2
  mode: NORMAL
  quietPeriod: 0
  scmCheckoutRetryCount: 0
  slaveAgentPort: -1
  disableRememberMe: true
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Prototype administrator"
          password: "${WEBBLOCK_ADMIN_PASSWORD}"
        - id: "provisioning"
          name: "Provisioning service"
          password: "${WEBBLOCK_PROVISIONING_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  # CSRF protection is Jenkins' default crumb issuer; API-token requests need no crumb.
security:
  apiToken:
    creationOfLegacyTokenEnabled: false
    tokenGenerationOnCreationEnabled: false
    usageStatisticsEnabled: false
unclassified:
  location:
    url: "${WEBBLOCK_JENKINS_ROOT_URL}"
