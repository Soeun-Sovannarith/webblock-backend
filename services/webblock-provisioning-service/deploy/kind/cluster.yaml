# Local Kind cluster (decision 0009 section 1), used by the prototype stack (deploy/kind/proto-up.sh).
# Test infrastructure only: it stands in for DOKS and proves nothing about DigitalOcean load balancers,
# certificates, node pools or storage.
# One control plane and one worker (about 0.7 GB per extra worker). No default CNI and no kube-proxy:
# Cilium (deploy/prototype/versions.sh) is installed by proto-up.sh with full kube-proxy replacement,
# mirroring DOKS's VPC-native mode.
# The cluster name is given on the command line; the API server listens on 127.0.0.1 only, which the
# scripts and the live Kind suites check before every call.
# The local registry (kind local-registry pattern): containerd reads per-registry hosts.toml files from
# /etc/containerd/certs.d, where proto-up.sh writes one for localhost:5001. The kind documentation says the
# patch is unnecessary from v0.27.0, but on kindest/node:v1.36.4 the effective containerd setting
# (`containerd config dump`) was config_path = '' without it (measured 7 October 2026), so it stays.
# containerd 2 migrates this version 2 key to plugins.'io.containerd.cri.v1.images'.registry.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
networking:
  apiServerAddress: "127.0.0.1"
  disableDefaultCNI: true
  kubeProxyMode: "none"
# Task PK (decision 0016 section 9 ruling 3): the kubelets re-sync mounted ConfigMaps every 5 s instead of
# every minute, so a stand-in file the e2e harness rewrites reaches the pods within seconds; and each
# container keeps up to 100 MiB of log before rotating, so the host's log follower
# (scripts/prototype/follow_logs.py) meets no rotation within a run. A cluster made before this change keeps
# the old settings: make proto-down proto-up.
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    syncFrequency: 5s
    containerLogMaxSize: 100Mi
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
