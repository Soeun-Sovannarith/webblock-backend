# Traefik on the k3d engine (spike design .claude/docs/designs/k3s-site-cluster-spike.md G6). k3s installs
# its packaged Traefik (chart traefik-40.1.5+up40.1.0, Traefik 3.7.13) and merges these values into it.
# proto-up mounts this file into the server node's /var/lib/rancher/k3s/server/manifests/ before k3s
# starts, so Traefik never runs without them. Value names as in the upstream chart v40.1.0 values.yaml.
#   - Only the Gateway API provider routes traffic: the admission policies of deploy/prototype/policy
#     cover HTTPRoutes only, so Ingress and Traefik's own IngressRoute CRDs are off.
#   - The chart's own Gateway is off (the stack's Gateway is webblock-gateway/webblock-public,
#     deploy/prototype/gateway/20-gateway-traefik.yaml); its GatewayClass traefik is on.
#   - Entry points web (8000) and websecure (8443) are exposed by the Service as 80 and 443. A Gateway
#     listener's port must equal an entry point's port, hence 8000 and 8443 on the Gateway.
#   - statusAddress (chart default) copies the Service's load balancer address (k3s ServiceLB) into the
#     Gateway's status.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesGateway:
        enabled: true
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        enabled: false
    gateway:
      enabled: false
    gatewayClass:
      enabled: true
      name: traefik
    ports:
      web:
        port: 8000
        exposedPort: 80
      websecure:
        port: 8443
        exposedPort: 443
