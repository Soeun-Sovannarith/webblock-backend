# Helm values layered over values/cilium.yaml: every Cilium image comes from the local registry, which
# deploy/kind/proto-up.sh fills by digest before Cilium is installed (quay.io resets connections from the
# development laptop). Only the repositories change. Tags and digests stay the chart's own pins
# (image.useDigest: true), so the nodes pull localhost:5001/cilium/<image>:<chart tag>@<chart digest>,
# the same index digests the chart pins upstream. proto-up.sh renders the chart with and without this
# file and refuses to install unless each image differs only by the localhost:5001 prefix, and every one
# is in PROTO_MIRROR_IMAGES (deploy/prototype/versions.sh) and served by the local registry with that
# digest.
# Kind test infrastructure only: on DOKS, Cilium is the platform's.
image:
  repository: localhost:5001/cilium/cilium
operator:
  image:
    # The chart appends "-generic" (the cloud) to this repository.
    repository: localhost:5001/cilium/operator
envoy:
  image:
    repository: localhost:5001/cilium/cilium-envoy
