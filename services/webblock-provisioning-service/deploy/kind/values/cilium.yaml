# Helm values for Cilium on Kind (decision 0009 sections 1 and 2): chart 1.20.2 for the prototype stack
# (proto-up.sh, task T1). They were written for chart 1.19.8 of the Phase 4 stack (branch go-reference)
# and are used unchanged. proto-up.sh adds k8sServiceHost=<cluster>-control-plane, the only value that
# depends on the cluster name. Every Cilium image is pinned by digest by the chart itself (image.useDigest: true).

# Full kube-proxy replacement, as on DOKS VPC-native clusters; the Kind config has kubeProxyMode: none,
# so the agent must reach the API server directly.
kubeProxyReplacement: true
k8sServicePort: 6443

# Pod CIDRs come from the node objects that kubeadm in Kind allocates.
ipam:
  mode: kubernetes

# Kind nodes share the host's cgroup v2 hierarchy; Cilium's documented Kind settings.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Cilium's own Gateway API implementation, GatewayClass "cilium", as DOKS provisions it (OD-35).
# The Gateway API standard CRDs (v1.6.1 with ListenerSet, deploy/prototype/versions.sh) are
# installed before this chart, so the class is created and, on 1.20, ListenerSet support is enabled
# (the operator detects the CRD at start; no Helm value turns it on).
gatewayAPI:
  enabled: true
  gatewayClass:
    create: "true"

# LoadBalancer addresses for the Gateway's Service: Cilium LB-IPAM (pool from proto-up.sh) announced on the
# Kind Docker network by L2 announcements (ARP). No host process and no Docker socket are needed.
l2announcements:
  enabled: true
# A 1.19 value; the 1.20 chart has no externalIPs key and ignores it.
externalIPs:
  enabled: true
# L2 announcements hold one Lease per announced Service; Cilium's documentation asks for a higher
# client rate limit than the default 10/20.
k8sClientRateLimit:
  qps: 30
  burst: 60

# One operator replica is enough for a two-node test cluster and saves memory.
operator:
  replicas: 1

# Not needed on the local stack; saves memory on a shared laptop.
hubble:
  enabled: false
