{{- /* The release worker: the projected token of ServiceAccount provisioning-worker, the Gateway's CA for
the promotion probe, WORKER_ID from the pod's name. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-worker
  labels:
    {{- include "provisioning.labels" (dict "root" $ "component" "worker") | trim | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "provisioning.selector" (dict "root" $ "component" "worker") | trim | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "provisioning.labels" (dict "root" $ "component" "worker") | trim | nindent 8 }}
      annotations:
        checksum/env: {{ .Values.worker.env | toJson | sha256sum }}
    spec:
      serviceAccountName: provisioning-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "provisioning.podSecurity" . | trim | nindent 8 }}
      {{- include "provisioning.placement" . | trim | nindent 6 }}
      containers:
        - name: worker
          image: {{ .Values.image | quote }}
          command: ["/opt/venv/bin/python", "-m", "provisioning.hosts.worker"]
          envFrom:
            - configMapRef:
                name: provisioning-worker-env
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- include "provisioning.secretEnv" (dict "component" "worker" "keys" .Values.worker.secretEnv) | trim | nindent 12 }}
          ports:
            - name: ops
              containerPort: 9090
          {{- include "provisioning.probes" (dict "ready" "/healthz") | trim | nindent 10 }}
          resources:
            requests:
              memory: {{ .Values.worker.memory | quote }}
              cpu: {{ .Values.worker.cpu | quote }}
            limits:
              memory: {{ .Values.worker.memory | quote }}
          securityContext:
            {{- include "provisioning.containerSecurity" . | trim | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kube
              mountPath: /var/run/secrets/webblock/kube
              readOnly: true
            - name: gateway-ca
              mountPath: /etc/webblock/gateway-ca
              readOnly: true
            {{- if .Values.standins }}
            {{- include "provisioning.standinsMount" . | trim | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "provisioning.tmpVolume" . | trim | nindent 8 }}
        {{- include "provisioning.kubeVolume" . | trim | nindent 8 }}
        - name: gateway-ca
          configMap:
            name: provisioning-gateway-ca
        {{- if .Values.standins }}
        {{- include "provisioning.standinsVolume" . | trim | nindent 8 }}
        {{- end }}
