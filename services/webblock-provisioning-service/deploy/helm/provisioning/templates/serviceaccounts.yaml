{{- /* The API's and the build worker's own ServiceAccounts, which hold no token (decision 0016 section 9
ruling 2). provisioning-worker and tenant-bootstrap belong to the platform layer (deploy/prototype/rbac). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provisioning-api
  labels:
    {{- include "provisioning.labels" (dict "root" $ "component" "api") | trim | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provisioning-build-worker
  labels:
    {{- include "provisioning.labels" (dict "root" $ "component" "build-worker") | trim | nindent 4 }}
automountServiceAccountToken: false
