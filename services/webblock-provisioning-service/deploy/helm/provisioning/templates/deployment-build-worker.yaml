{{- /* The build worker: Jenkins and the build-system intake. No Kubernetes token at all. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-build-worker
  labels:
    {{- include "provisioning.labels" (dict "root" $ "component" "build-worker") | trim | nindent 4 }}
spec:
  replicas: {{ .Values.buildWorker.replicas }}
  selector:
    matchLabels:
      {{- include "provisioning.selector" (dict "root" $ "component" "build-worker") | trim | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "provisioning.labels" (dict "root" $ "component" "build-worker") | trim | nindent 8 }}
      annotations:
        checksum/env: {{ .Values.buildWorker.env | toJson | sha256sum }}
    spec:
      serviceAccountName: provisioning-build-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "provisioning.podSecurity" . | trim | nindent 8 }}
      {{- include "provisioning.placement" . | trim | nindent 6 }}
      containers:
        - name: build-worker
          image: {{ .Values.image | quote }}
          command: ["/opt/venv/bin/python", "-m", "provisioning.hosts.build_worker"]
          envFrom:
            - configMapRef:
                name: provisioning-build-worker-env
          env:
            {{- include "provisioning.secretEnv" (dict "component" "build-worker" "keys" .Values.buildWorker.secretEnv) | trim | nindent 12 }}
          ports:
            - name: ops
              containerPort: 9090
          {{- include "provisioning.probes" (dict "ready" "/healthz") | trim | nindent 10 }}
          resources:
            requests:
              memory: {{ .Values.buildWorker.memory | quote }}
              cpu: {{ .Values.buildWorker.cpu | quote }}
            limits:
              memory: {{ .Values.buildWorker.memory | quote }}
          securityContext:
            {{- include "provisioning.containerSecurity" . | trim | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.standins }}
            {{- include "provisioning.standinsMount" . | trim | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "provisioning.tmpVolume" . | trim | nindent 8 }}
        {{- if .Values.standins }}
        {{- include "provisioning.standinsVolume" . | trim | nindent 8 }}
        {{- end }}
