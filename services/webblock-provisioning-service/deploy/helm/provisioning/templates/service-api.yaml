apiVersion: v1
kind: Service
metadata:
  name: provisioning-api
  labels:
    {{- include "provisioning.labels" (dict "root" $ "component" "api") | trim | nindent 4 }}
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "provisioning.selector" (dict "root" $ "component" "api") | trim | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
