{{- /* The migrations, before every install and upgrade (decision 0016 section 3): goose up as the login
prov_migrator_login, whose role option makes current_user provisioning_migrator (the guard of
src/migrations/00001). The database URL comes from Secret provisioning-migrate-secret. A failed Job stays
for its log until the next attempt replaces it; a successful one is deleted. It runs under the
namespace's default ServiceAccount with no token. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: provisioning-migrate
  labels:
    {{- include "provisioning.labels" (dict "root" $ "component" "migrate") | trim | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "provisioning.labels" (dict "root" $ "component" "migrate") | trim | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "provisioning.podSecurity" . | trim | nindent 8 }}
      {{- include "provisioning.placement" . | trim | nindent 6 }}
      containers:
        - name: migrate
          image: {{ .Values.image | quote }}
          command: ["/usr/local/bin/goose", "up"]
          env:
            - name: GOOSE_DRIVER
              value: postgres
            - name: GOOSE_MIGRATION_DIR
              value: /app/src/migrations
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef:
                  name: provisioning-migrate-secret
                  key: GOOSE_DBSTRING
          resources:
            requests:
              memory: {{ .Values.migrate.memory | quote }}
              cpu: {{ .Values.migrate.cpu | quote }}
            limits:
              memory: {{ .Values.migrate.memory | quote }}
          securityContext:
            {{- include "provisioning.containerSecurity" . | trim | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "provisioning.tmpVolume" . | trim | nindent 8 }}
