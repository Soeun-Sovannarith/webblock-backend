{{- /* The API: REST and MCP on 8080, /healthz and /readyz on 8081. No Kubernetes token at all. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-api
  labels:
    {{- include "provisioning.labels" (dict "root" $ "component" "api") | trim | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "provisioning.selector" (dict "root" $ "component" "api") | trim | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "provisioning.labels" (dict "root" $ "component" "api") | trim | nindent 8 }}
      annotations:
        checksum/env: {{ .Values.api.env | toJson | sha256sum }}
    spec:
      serviceAccountName: provisioning-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "provisioning.podSecurity" . | trim | nindent 8 }}
      {{- include "provisioning.placement" . | trim | nindent 6 }}
      containers:
        - name: api
          image: {{ .Values.image | quote }}
          command: ["/opt/venv/bin/python", "-m", "provisioning.hosts.api"]
          envFrom:
            - configMapRef:
                name: provisioning-api-env
          env:
            {{- include "provisioning.secretEnv" (dict "component" "api" "keys" .Values.api.secretEnv) | trim | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            - name: ops
              containerPort: 8081
          {{- include "provisioning.probes" (dict "ready" "/readyz") | trim | nindent 10 }}
          resources:
            requests:
              memory: {{ .Values.api.memory | quote }}
              cpu: {{ .Values.api.cpu | quote }}
            limits:
              memory: {{ .Values.api.memory | quote }}
          securityContext:
            {{- include "provisioning.containerSecurity" . | trim | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.standins }}
            {{- include "provisioning.standinsMount" . | trim | nindent 12 }}
            - name: dev-tokens
              mountPath: /etc/webblock/dev-tokens
              readOnly: true
            {{- end }}
      volumes:
        {{- include "provisioning.tmpVolume" . | trim | nindent 8 }}
        {{- if .Values.standins }}
        {{- include "provisioning.standinsVolume" . | trim | nindent 8 }}
        - name: dev-tokens
          secret:
            secretName: provisioning-dev-tokens
        {{- end }}
