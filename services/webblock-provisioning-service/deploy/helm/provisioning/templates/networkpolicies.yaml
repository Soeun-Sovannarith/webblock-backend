{{- /* Default deny in both directions for every pod of the chart (enableDefaultDeny), then only what each
process needs (task PK). CiliumNetworkPolicy, because the API server and the Gateway's Envoy are Cilium
entities that a Kubernetes NetworkPolicy cannot name. Addresses outside the cluster come from values
networkPolicy. */}}
{{- $net := .Values.networkPolicy }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: provisioning-api
  labels:
    {{- include "provisioning.labels" (dict "root" $ "component" "api") | trim | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # REST and MCP from wherever the Service is reachable: the API is public and the token is the check.
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The kubelet's probes.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    {{- include "provisioning.dnsEgress" . | trim | nindent 4 }}
    {{- include "provisioning.cidrEgress" (dict "cidr" $net.database "port" 5432) | trim | nindent 4 }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: provisioning-worker
  labels:
    {{- include "provisioning.labels" (dict "root" $ "component" "worker") | trim | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    {{- include "provisioning.dnsEgress" . | trim | nindent 4 }}
    {{- include "provisioning.cidrEgress" (dict "cidr" $net.database "port" 5432) | trim | nindent 4 }}
    {{- include "provisioning.cidrEgress" (dict "cidr" $net.broker "port" 5672) | trim | nindent 4 }}
    # The API server, as ServiceAccount provisioning-worker.
    - toEntities:
        - kube-apiserver
    # The promotion probe goes through the Gateway: its Envoy, and the site pods behind it, which
    # Cilium's Envoy checks against the client's egress policy (measured for tenants,
    # deploy/prototype/policy/tenant-network.yaml.tmpl).
    - toEntities:
        - ingress
    - toEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.websites.webblock.internal/tenant: "true"
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: provisioning-build-worker
  labels:
    {{- include "provisioning.labels" (dict "root" $ "component" "build-worker") | trim | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: build-worker
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    {{- include "provisioning.dnsEgress" . | trim | nindent 4 }}
    {{- include "provisioning.cidrEgress" (dict "cidr" $net.database "port" 5432) | trim | nindent 4 }}
    {{- include "provisioning.cidrEgress" (dict "cidr" $net.broker "port" 5672) | trim | nindent 4 }}
    {{- include "provisioning.cidrEgress" (dict "cidr" $net.jenkins "port" 8080) | trim | nindent 4 }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: provisioning-bootstrap
  labels:
    {{- include "provisioning.labels" (dict "root" $ "component" "bootstrap") | trim | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: bootstrap
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    {{- include "provisioning.dnsEgress" . | trim | nindent 4 }}
    {{- include "provisioning.cidrEgress" (dict "cidr" $net.database "port" 5432) | trim | nindent 4 }}
    {{- include "provisioning.cidrEgress" (dict "cidr" $net.catalog "port" 5432) | trim | nindent 4 }}
    # The API server, as ServiceAccount tenant-bootstrap.
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: provisioning-migrate
  labels:
    {{- include "provisioning.labels" (dict "root" $ "component" "migrate") | trim | nindent 4 }}
  # A hook, created before the migration Job (weight -5 against 0), so the Job never runs unconfined
  # on a first install. Helm does not delete hooks on uninstall: the run script's cluster_stop does.
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: migrate
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    {{- include "provisioning.dnsEgress" . | trim | nindent 4 }}
    {{- include "provisioning.cidrEgress" (dict "cidr" $net.database "port" 5432) | trim | nindent 4 }}
