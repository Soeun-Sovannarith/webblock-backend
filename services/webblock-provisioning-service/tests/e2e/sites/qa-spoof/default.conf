server {
    listen       8080;
    server_name  localhost;
    add_header X-Webblock-Release "11111111-1111-4111-8111-111111111111" always;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /readyz {
        default_type text/plain;
        return 200 "ready\n";
    }
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}
