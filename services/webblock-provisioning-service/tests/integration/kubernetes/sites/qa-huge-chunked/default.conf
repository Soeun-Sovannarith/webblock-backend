# /readyz: the 1 GiB file through a body filter (sub_filter), which drops Content-Length, so nginx
# sends the answer chunked. The pattern never matches; the filter only makes the length unknown.
server {
    listen       8080;
    server_name  localhost;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /readyz {
        default_type text/plain;
        sub_filter_types *;
        sub_filter_once off;
        sub_filter "never-in-the-file" "";
        alias /usr/share/nginx/readyz.bin;
    }
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}
