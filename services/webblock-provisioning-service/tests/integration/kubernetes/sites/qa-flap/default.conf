map $msec $qa_ready {
    default       0;
    ~\.[0-4][0-9][0-9]$  1;
}

server {
    listen       8080;
    server_name  localhost;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /readyz {
        default_type text/plain;
        if ($qa_ready = 1) {
            return 200 "ready\n";
        }
        return 503 "not ready\n";
    }
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}
