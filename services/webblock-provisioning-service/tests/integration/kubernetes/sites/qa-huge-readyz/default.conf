server {
    listen       8080;
    server_name  localhost;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /readyz {
        default_type text/plain;
        alias /usr/share/nginx/readyz.bin;
    }
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}
