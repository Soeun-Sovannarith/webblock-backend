# The Python port of the Provisioning service (decision 0013). Tool settings here are the gates of
# section 4 of .claude/CLAUDE.md; mk/python.mk runs them (.claude/docs/runbooks/python-p0.md).

[project]
name = "webblock-provisioning"
version = "0.0.0"
description = "WebBlock Provisioning service (Python port, decision 0013)."
requires-python = ">=3.14,<3.15"
# Runtime dependencies: the prototype's full set, added once by the lead so that parallel tasks never
# edit the lock (decision 0014). Exact pins; names checked against review-stack.md N1. psycopg[binary]
# also at runtime in the prototype (0013 section 9 S2 applies again for production).
# prometheus-client and sentry-sdk: task H4 (decision 0016 section 5 item 4), the newest versions at
# least 14 days old on 10 October 2026 (prometheus-client 0.26.0 of 2026-07-24, sentry-sdk 2.70.0 of
# 2026-09-22; 2.71.0 of 2026-09-28 was too young).
# gRPC and OpenTelemetry: Phase B (decision 0022 E10, owner approved 24 October 2026), the newest
# versions uploaded on or before exclude-newer with CPython 3.14 wheels: grpcio and grpcio-status
# 1.84.0 (2026-09-14; 1.85.0rc1 is a pre-release), protobuf 7.36.2 (2026-09-17), opentelemetry-sdk
# and opentelemetry-exporter-otlp-proto-http 1.45.1 (2026-10-06), opentelemetry-instrumentation-fastapi
# 0.66b1 (2026-10-06; the instrumentation line has only beta versions, paired with sdk 1.45.1).
dependencies = [
    "aio-pika==10.1.0",
    "fastapi==0.142.2",
    "grpcio==1.84.0",
    # Kept for googleapis-common-protos (google.rpc ErrorInfo, read by infrastructure/grpc/call.py).
    "grpcio-status==1.84.0",
    "httpx2==2.13.1",
    "kubernetes-asyncio==36.1.0",
    "mcp==2.3.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-sdk==1.45.1",
    "prometheus-client==0.26.0",
    "protobuf==7.36.2",
    # No pool extra: SQLAlchemy pools the connections (decision 0026 Q7).
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pyjwt[crypto]==2.15.1",
    "sentry-sdk==2.70.0",
    "sqlalchemy[asyncio]==2.1.3",
    "structlog==26.1.0",
    "uvicorn==0.54.0",
    # The shared WebBlock auth library (constitution II.1, II.2; decision 0024): the release wheel
    # committed under vendor/, its SHA-256 in uv.lock. It does the token check (FR-2) and the
    # identity headers of calls to our own services (FR-8).
    "webblock-commons[fastapi,grpc]==0.1.0",
]

[dependency-groups]
# Development tools (ruling 10.6): the newest versions allowed by exclude-newer, exact pins.
dev = [
    "import-linter==2.15",
    "mypy==2.3.1",
    # make qa-sweep only (decision 0026): pylint runs just its duplicate-code check (R0801). It is
    # GPL-2.0-or-later, a development tool that never enters the runtime image.
    "pylint==4.1.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "ruff==0.16.8",
    "testcontainers==4.15.0",
    # make qa-sweep only (decision 0026): dead code, MIT.
    "vulture==2.16",
]

[build-system]
# uv's own build backend, published with uv as a wheel (no source build); the import name differs
# from the distribution name, see [tool.uv.build-backend].
requires = ["uv_build==0.12.18"]
build-backend = "uv_build"

[tool.uv]
# An absolute timestamp; moving it is a lock change the lead reviews. The 14-day rule of ruling 10.5
# is suspended for the prototype (decision 0014 section 5). mk/python.mk runs uv with UV_NO_CONFIG=1, under which uv ignores this
# table, so it passes the same two settings to uv as UV_EXCLUDE_NEWER (read from this line) and
# UV_NO_BUILD=1 (.claude/docs/runbooks/python-p0.md, "uv settings").
exclude-newer = "2026-10-10T00:00:00Z"
# No source distribution is ever built; the project itself is built by uv_build.
no-build = true

[tool.uv.build-backend]
module-name = "provisioning"
module-root = "src"

[tool.uv.sources]
# The GitHub Release v0.1.0 wheel of itme-roa15/webblock-commons; no token is needed to build.
webblock-commons = { path = "vendor/webblock_commons-0.1.0-py3-none-any.whl" }

# --- ruff ------------------------------------------------------------------------------------------

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
# Python sources only: ruff 0.16 would otherwise also format the Python blocks in .claude/docs/ and ai/
# Markdown files, which are not part of the Python gates.
# The protobuf code generated by make contracts-sync (decision 0022 E3) is excluded: it is not
# handwritten, and make contracts-check proves it matches the pinned commit.
include = ["*.py", "*.pyi", "**/pyproject.toml"]
extend-exclude = [
    ".claude",
    "bin",
    "deploy",
    ".venv",
    "src/provisioning/infrastructure/grpc/_gen",
]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "W",       # pycodestyle warnings
    "I",       # import order
    "UP",      # pyupgrade
    "B",       # bugbear
    "S",       # bandit subset
    "ASYNC",   # asyncio hazards
    "RUF",     # ruff rules, RUF006 (dangling task) included
    "PLW0603", # global statement
    "TID",     # tidy imports, TID251 (banned-api) included
    # Decision 0026: code quality rule sets, blocking like the ones above.
    "ERA",     # commented-out code
    "PIE",     # unnecessary statements
    "RET",     # return statements
    "FAST",    # FastAPI usage
    "DTZ",     # datetimes without a time zone
    "C90",     # McCabe complexity
]

[tool.ruff.lint.mccabe]
# Decision 0026: above the most complex function the code has today, so the rule stops growth.
max-complexity = 18

[tool.ruff.lint.per-file-ignores]
# The single exemption from the banned-api list: the Kubernetes client wrapper written in P4
# (decision 0013 section 9, real-cluster safety). It is the only module allowed to call a
# Kubernetes config loader, and it must pass an explicit project-local path with
# persist_config=False. The file does not exist yet; ruff applies the entry once it does.
"src/provisioning/infrastructure/kubernetes/_client.py" = ["TID251"]
# Tests assert with the assert statement (S101). The contract self-tests run the gate tools in a
# subprocess with an argument list built from fixed paths, never through a shell (S603).
"tests/**" = ["S101"]
"tests/contracts/**" = ["S101", "S603"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Kubernetes config loaders read $KUBECONFIG or ~/.kube/config and write refreshed credentials
# back (review-stack.md H2). Only the wrapper above may build a client.
"kubernetes_asyncio.config".msg = "Kubernetes config loaders are banned outside infrastructure/kubernetes/_client.py (decision 0013 section 9)."
"kubernetes_asyncio.config.load_config".msg = "Banned: reads $KUBECONFIG or ~/.kube/config. Use the wrapper in infrastructure/kubernetes/_client.py."
"kubernetes_asyncio.config.load_kube_config".msg = "Banned: reads $KUBECONFIG or ~/.kube/config. Use the wrapper in infrastructure/kubernetes/_client.py."
"kubernetes_asyncio.config.load_incluster_config".msg = "Banned: only the wrapper in infrastructure/kubernetes/_client.py builds a client."
"kubernetes_asyncio.config.new_client_from_config".msg = "Banned: reads $KUBECONFIG or ~/.kube/config. Use the wrapper in infrastructure/kubernetes/_client.py."
"kubernetes_asyncio.config.list_kube_config_contexts".msg = "Banned: reads $KUBECONFIG or ~/.kube/config. Use the wrapper in infrastructure/kubernetes/_client.py."
"kubernetes_asyncio.config.kube_config".msg = "Banned: the module reads $KUBECONFIG or ~/.kube/config. Use the wrapper in infrastructure/kubernetes/_client.py."
"kubernetes_asyncio.config.kube_config.KUBE_CONFIG_DEFAULT_LOCATION".msg = "Banned: the default kubeconfig path is never used (decision 0013 section 9)."
"kubernetes.config".msg = "Kubernetes config loaders are banned outside infrastructure/kubernetes/_client.py (decision 0013 section 9)."
"kubernetes.config.load_config".msg = "Banned: reads $KUBECONFIG or ~/.kube/config. Use the wrapper in infrastructure/kubernetes/_client.py."
"kubernetes.config.load_kube_config".msg = "Banned: reads $KUBECONFIG or ~/.kube/config. Use the wrapper in infrastructure/kubernetes/_client.py."
"kubernetes.config.load_incluster_config".msg = "Banned: only the wrapper in infrastructure/kubernetes/_client.py builds a client."
"kubernetes.config.new_client_from_config".msg = "Banned: reads $KUBECONFIG or ~/.kube/config. Use the wrapper in infrastructure/kubernetes/_client.py."
"kubernetes.config.list_kube_config_contexts".msg = "Banned: reads $KUBECONFIG or ~/.kube/config. Use the wrapper in infrastructure/kubernetes/_client.py."
"kubernetes.config.kube_config".msg = "Banned: the module reads $KUBECONFIG or ~/.kube/config. Use the wrapper in infrastructure/kubernetes/_client.py."
"kubernetes.config.kube_config.KUBE_CONFIG_DEFAULT_LOCATION".msg = "Banned: the default kubeconfig path is never used (decision 0013 section 9)."
"kubernetes.aio.config".msg = "Kubernetes config loaders are banned outside infrastructure/kubernetes/_client.py (decision 0013 section 9)."
"kubernetes.aio.config.load_config".msg = "Banned: reads $KUBECONFIG or ~/.kube/config. Use the wrapper in infrastructure/kubernetes/_client.py."
"kubernetes.aio.config.load_kube_config".msg = "Banned: reads $KUBECONFIG or ~/.kube/config. Use the wrapper in infrastructure/kubernetes/_client.py."
"kubernetes.aio.config.load_incluster_config".msg = "Banned: only the wrapper in infrastructure/kubernetes/_client.py builds a client."
"kubernetes.aio.config.new_client_from_config".msg = "Banned: reads $KUBECONFIG or ~/.kube/config. Use the wrapper in infrastructure/kubernetes/_client.py."
"kubernetes.aio.config.list_kube_config_contexts".msg = "Banned: reads $KUBECONFIG or ~/.kube/config. Use the wrapper in infrastructure/kubernetes/_client.py."
"kubernetes.aio.config.kube_config".msg = "Banned: the module reads $KUBECONFIG or ~/.kube/config. Use the wrapper in infrastructure/kubernetes/_client.py."
"kubernetes.aio.config.kube_config.KUBE_CONFIG_DEFAULT_LOCATION".msg = "Banned: the default kubeconfig path is never used (decision 0013 section 9)."
# lightkube cannot send fieldValidation (review-stack.md H1; decision 0013 section 9, S4).
"lightkube".msg = "lightkube is dropped: it cannot send fieldValidation (decision 0013 section 9, S4)."
# One HTTP client, httpx2 (decision 0013 section 9, S1); no synchronous HTTP client.
"requests".msg = "Synchronous HTTP is banned; use httpx2 with explicit timeouts (decision 0013 section 9, S1)."
"httpx".msg = "httpx is not used; use httpx2 (decision 0013 section 9, S1)."
# psycopg 3 only (decision 0013 section 4).
"psycopg2".msg = "psycopg2 is a different generation; use psycopg 3 (decision 0013 section 4)."
# PyJWKClient fetches synchronously and blocks the event loop (review-stack.md M7).
"jwt.PyJWKClient".msg = "PyJWKClient blocks the event loop; fetch the JWKS asynchronously (review-stack.md M7)."
# Dynamic imports defeat the import-linter contracts (review-port-arch.md M6).
"importlib.import_module".msg = "Dynamic imports defeat the layer contracts (review-port-arch.md M6)."

# --- mypy ------------------------------------------------------------------------------------------

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src/provisioning", "tests"]
mypy_path = "src"
# tests/ has no __init__.py (ruling 10.9); module names come from the directory structure.
explicit_package_bases = true
warn_unreachable = true
# Decision 0026: a call to an API marked @deprecated (PEP 702) is an error.
enable_error_code = ["deprecated"]
# The generated protobuf code (decision 0022 E3) is not checked; importers see its .pyi stubs.
exclude = ["^src/provisioning/infrastructure/grpc/_gen/"]

[[tool.mypy.overrides]]
# The single per-module override (review-stack.md M1; task D): kubernetes_asyncio's generated code is
# unannotated, so calling it is an untyped call under --strict. The library is used only in this
# wrapper module, which returns plain dicts and typed errors to the rest of the package.
module = "provisioning.infrastructure.kubernetes._client"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# grpcio, grpcio-status, protobuf and googleapis-common-protos ship no inline types, and no stub
# package is pinned (decision 0022 E10 lists the approved dependencies). Their names are imported
# only by infrastructure/grpc and the gRPC clients, which wrap them in typed functions.
module = ["grpc", "grpc.*", "grpc_status", "google.protobuf.*", "google.rpc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Generated by make contracts-sync (decision 0022 E3): follow it silently, so the modules that import
# it get the types of its .pyi stubs and no error is reported inside it.
module = "provisioning.infrastructure.grpc._gen.*"
follow_imports = "silent"

# --- pytest ----------------------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
norecursedirs = [".claude", "bin", "deploy", ".venv", ".git", "__pycache__"]
filterwarnings = ["error"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
timeout = 120
# Applied by directory in tests/conftest.py; a test outside these folders is refused.
markers = [
    "unit: tests/unit, mirrors the package; no external service",
    "contract: tests/contracts, gate self-tests and contract checks",
    "integration: tests/integration, real PostgreSQL 18; a skip is a failure",
    "messaging: tests/messaging, real RabbitMQ; a skip is a failure",
    "jenkins: tests/integration/jenkins, the prototype's local Jenkins (decision 0014); a skip is a failure",
    "kind: tests/integration/kubernetes, the prototype's Kind stack (decision 0014); a skip is a failure",
    "catalog_live: tests/integration/catalog, the prototype stack's catalog database and Kind (decision 0014 section 14); a skip is a failure",
    "e2e: tests/e2e, the four processes on the prototype stack (task G, make proto-up proto-run); a skip is a failure",
    "chart: tests/chart, the Helm chart rendered offline by the pinned bin/helm (make chart-check; task PK); a skip is a failure",
]

# --- coverage --------------------------------------------------------------------------------------

[tool.coverage.run]
source_pkgs = ["provisioning"]
branch = false
# Generated code only (CLAUDE.md section 4): the protobuf modules of make contracts-sync (0022 E3).
omit = ["*/provisioning/infrastructure/grpc/_gen/*"]

[tool.coverage.report]
# Statement coverage with nothing excluded: no pragma, and no omitted handwritten file (CLAUDE.md
# section 4).
exclude_lines = []
show_missing = true

# --- import-linter ---------------------------------------------------------------------------------

[tool.importlinter]
root_packages = ["provisioning"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Clean Architecture layers (decision 0010, decision 0013 section 4)"
type = "layers"
layers = [
    "provisioning.hosts",
    "provisioning.presentation | provisioning.infrastructure",
    "provisioning.core.application",
    "provisioning.core.domain",
]

# Task G (decision 0014 section 3): which host may hold which cluster identity. The API and the
# build worker hold none; the worker holds only its own, and never the bootstrap adapter that
# creates namespaces and RoleBindings; the bootstrap process holds only the bootstrap identity
# and no broker or worker loop.
[[tool.importlinter.contracts]]
id = "hosts-no-kubernetes"
name = "The API and build worker hosts import no Kubernetes client (decision 0013 section 9, A4; decision 0014 section 3)"
type = "forbidden"
source_modules = ["provisioning.hosts.api", "provisioning.hosts.build_worker"]
forbidden_modules = ["kubernetes_asyncio", "kubernetes", "provisioning.infrastructure.kubernetes"]

# Finding F-6 of H-V (task H2, decision 0016 section 6): only the build worker holds the Jenkins
# token and the provisioning_build login, so the API host does not even link the Jenkins client or
# the build store, directly or through another module (hosts.shared.runtime, the postgres package).
[[tool.importlinter.contracts]]
id = "api-no-build-system"
name = "The API host imports neither the Jenkins client nor the build store (finding F-6 of H-V; decision 0016 section 6)"
type = "forbidden"
source_modules = ["provisioning.hosts.api"]
forbidden_modules = [
    "provisioning.infrastructure.jenkins",
    "provisioning.infrastructure.postgres.build_store",
]

[[tool.importlinter.contracts]]
id = "worker-no-bootstrap"
name = "The worker host never builds the bootstrap identity's adapter (decision 0013 section 3; decision 0014 section 3)"
type = "forbidden"
# The worker imports infrastructure.kubernetes (its SiteCluster) but not the bootstrap module or
# host; the package's __init__ does not import the bootstrap module.
source_modules = ["provisioning.hosts.worker"]
forbidden_modules = [
    "provisioning.infrastructure.kubernetes.bootstrap",
    "provisioning.hosts.bootstrap",
    # Task 13 (decision 0025 FL8): the bootstrap loop moved into the application.
    "provisioning.core.application.tenants",
]

[[tool.importlinter.contracts]]
id = "bootstrap-reads-and-creates-tenants-only"
name = "The bootstrap host runs no broker, no worker loop and not the worker's cluster adapter (decision 0014 sections 3 and 10.1)"
type = "forbidden"
source_modules = ["provisioning.hosts.bootstrap"]
forbidden_modules = [
    "aio_pika",
    "provisioning.infrastructure.rabbitmq",
    # Task 13 (decision 0025 FL6, FL7 and FL12): the former provisioning.workers package is
    # the RabbitMQ listeners plus the loops, executors and relays now in core/application, named
    # one by one because the bootstrap imports the application facade. Design 2026-10-28 section
    # 7.2: a wildcard over provisioning.core.application.*.background breaks, because the facade
    # imports job modules (StartBuild, PollBuilds), so the list stays explicit with the new paths.
    "provisioning.presentation.messaging",
    "provisioning.core.application.shared.backoff",
    "provisioning.core.application.jobs.background.dispatcher",
    "provisioning.core.application.intake.background.inbox_processor",
    "provisioning.core.application.builds.background.build_poller",
    "provisioning.core.application.deploys.background.deploy_executor",
    "provisioning.core.application.deploys.background.redeploy_executor",
    "provisioning.core.application.routing.background.routing_executor",
    "provisioning.core.application.hosting.background.hosting_executor",
    "provisioning.core.application.hosting.background.retry_sweeper",
    "provisioning.core.application.reconcile.background.reconciler",
    "provisioning.core.application.usage.background.usage_publisher",
    "provisioning.core.application.builds.background.hints",
    "provisioning.infrastructure.kubernetes.site_cluster",
    "provisioning.hosts.worker",
]

# Task H2: the prototype's stand-ins are built only by hosts/shared/stand_ins.py, which refuses every
# one of them in the production profile. No other module (no host __main__, no wiring, no worker) may
# import them; tests are outside the graph.
[[tool.importlinter.contracts]]
id = "standins-only-through-hosts-stand-ins"
name = "Only provisioning.hosts.shared.stand_ins imports the prototype stand-ins (task H2)"
type = "protected"
protected_modules = ["provisioning.infrastructure.standins"]
allowed_importers = ["provisioning.hosts.shared.stand_ins"]

# Task 13 (decision 0025 FL12): core/application/shared and core/application/ports
# are the leaves every feature uses; they import only the domain and each other, never a feature.
[[tool.importlinter.contracts]]
id = "application-shared-and-ports-are-leaves"
name = "core.application.shared and core.application.ports import no feature (decision 0025 FL12)"
type = "forbidden"
source_modules = [
    "provisioning.core.application.shared",
    "provisioning.core.application.ports",
]
forbidden_modules = [
    "provisioning.core.application.operations",
    "provisioning.core.application.jobs",
    "provisioning.core.application.intake",
    "provisioning.core.application.builds",
    "provisioning.core.application.deploys",
    "provisioning.core.application.routing",
    "provisioning.core.application.hosting",
    "provisioning.core.application.reconcile",
    "provisioning.core.application.usage",
    "provisioning.core.application.tenants",
]

# Design 2026-10-28 CQ3 (decision 0025, TR-2 amended): inside the domain, a rule or an event may use
# entities, an entity values, a value enums, and all of them the errors; never upward. Rules and
# events never import each other.
[[tool.importlinter.contracts]]
id = "domain-kinds"
name = "Domain kinds: rules | events above entities above values above enums above errors (decision 0025 CQ3)"
type = "layers"
containers = ["provisioning.core.domain"]
layers = [
    "rules | events",
    "entities",
    "values",
    "enums",
    "errors",
]

# Design 2026-10-28 CQ10 and CQ12 (decision 0025, TR-54): the command and query buses are a leaf.
# core.application.shared.cqrs imports nothing of ours, directly or through another module.
[[tool.importlinter.contracts]]
id = "cqrs-is-a-leaf"
name = "core.application.shared.cqrs imports nothing of provisioning (decision 0025 CQ10)"
type = "forbidden"
source_modules = ["provisioning.core.application.shared.cqrs"]
forbidden_modules = [
    "provisioning.core.domain",
    "provisioning.core.application.*",
    "provisioning.core.application.shared.*",
    "provisioning.infrastructure",
    "provisioning.presentation",
    "provisioning.hosts",
]

# Design 2026-10-28 CQ6 and CQ12 (decision 0025, TR-54, TR-55): a query reads and never reaches a
# command or a background job; a command never imports a query. Two contracts, one per direction.
[[tool.importlinter.contracts]]
id = "commands-and-queries-apart"
name = "Queries import no command and no background module (decision 0025 CQ12)"
type = "forbidden"
source_modules = ["provisioning.core.application.*.queries"]
forbidden_modules = [
    "provisioning.core.application.*.commands",
    "provisioning.core.application.*.background",
]

[[tool.importlinter.contracts]]
id = "commands-import-no-queries"
name = "Commands import no query (decision 0025 CQ12)"
type = "forbidden"
source_modules = ["provisioning.core.application.*.commands"]
forbidden_modules = ["provisioning.core.application.*.queries"]

# Task 13 (decision 0025 FL10 and FL12): devtools/ moved under hosts/, where the
# observability contract below would allow it the metrics, error-report and tracing libraries. These
# two contracts keep it as apart as before: no module of the package imports the prototype's dev
# tools (they are python -m entry points, never in the image), and the dev tools import none of the
# three libraries.
[[tool.importlinter.contracts]]
id = "devtools-stand-apart"
name = "No module imports provisioning.hosts.devtools (decision 0025 FL10)"
type = "protected"
protected_modules = ["provisioning.hosts.devtools"]
allowed_importers = []

[[tool.importlinter.contracts]]
id = "devtools-no-observability-libraries"
name = "provisioning.hosts.devtools imports no metrics, error-report or tracing library (decision 0025 FL10)"
type = "forbidden"
source_modules = ["provisioning.hosts.devtools"]
forbidden_modules = ["prometheus_client", "sentry_sdk", "opentelemetry"]
# Direct imports only, the same rule the observability contract's "protected" type applies: reaching
# the libraries through provisioning.infrastructure.telemetry is how every module measures.
allow_indirect_imports = true

# The former "hosts-not-wired" contract (review-port-arch.md H2) forbade the hosts the Phase 3
# stores and loops until they were ported; task G wires them, so it is removed. Its module names
# were stale anyway (B3's modules are intake_store and build_store, not intakestore and
# buildstore). The API host imports the PostgreSQL stores by design (B3, E1 concern 5).

# Decision 0022 E7: the gRPC libraries are imported by infrastructure only, so no host, worker or
# presentation module calls a channel directly.
[[tool.importlinter.contracts]]
id = "grpc-only-in-infrastructure"
name = "Only provisioning.infrastructure imports grpc (decision 0022 E7)"
type = "protected"
protected_modules = ["grpc"]
allowed_importers = ["provisioning.infrastructure"]

[[tool.importlinter.contracts]]
id = "core-no-frameworks"
name = "The core imports no framework, driver or logging library"
type = "forbidden"
source_modules = ["provisioning.core"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "pydantic",
    "psycopg",
    "psycopg_pool",
    "aio_pika",
    "kubernetes_asyncio",
    "kubernetes",
    "mcp",
    "structlog",
    # Task G: the core imports no SQL toolkit and no HTTP client either.
    "sqlalchemy",
    "httpx2",
    # Task H4: no metrics or error-report library either (the core has the measurement ports).
    "prometheus_client",
    "sentry_sdk",
    "grpc",
    "google",
    "opentelemetry",
    # Decision 0024: the shared auth library is an adapter concern (infrastructure, hosts).
    "webblock_commons",
]

# Task H4: only the telemetry adapter (and the composition roots) import the metrics and the
