spring:
  application:
    name: user-service
  config:
    # Local dev only: also read KEY=VALUE pairs from .env in the project folder (git ignores it).
    # "optional" = no error when the file is missing (Kubernetes uses real env vars).
    import: optional:file:.env[.properties]
  # Own database per service. Values come from env vars; never commit real credentials.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/webblock_user}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  # Flyway runs the migrations at startup with its own DB role (owns the tables).
  # Same database as the datasource; falls back to DB_USER / DB_PASSWORD when not set.
  flyway:
    user: ${FLYWAY_USER:${DB_USER}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD}}
    init-sqls: SET ROLE= account
  # Redis keeps the OTP codes (team decision: no OTP table). Local Docker for now.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  # SMTP for the OTP emails. Dev: Mailpit (localhost:1025, inbox at http://localhost:8025)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # Schema is created only by Flyway migrations (db/migration); Hibernate just checks it
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm URL, e.g. http://localhost:8180/realms/webblock (keys are fetched on first request)
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          # The token's "aud" must contain this (team format, webblock-commons); otherwise 401
          audiences: ${KEYCLOAK_AUDIENCE:webblock-account}
  cloud:
    openfeign:
      client:
        config:
          # Applies to every @FeignClient; override per client name if needed
          default:
            connect-timeout: 2000
            read-timeout: 5000

server:
  port: ${SERVER_PORT:8081}

# Local / dev: find other services through discovery-service (Eureka).
# On Kubernetes the "k8s" profile turns this off (see application-k8s.yml).
eureka:
  client:
    # Set EUREKA_CLIENT_ENABLED=false (env or .env) when discovery-service is not running
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Our own settings (values that "can change" live here, not in code)
webblock:
  otp:
    secret: ${OTP_SECRET:}            # long random text, only in .env / Kubernetes secret
    code-ttl: 10m
    max-attempts: 5
    resend-after: 60s
    verification-ttl: 10m
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:https://auth.roa-dev.digital}
    admin-url: ${KEYCLOAK_ADMIN_URL:${KEYCLOAK_SERVER_URL:https://auth.roa-dev.digital}}
    realm: ${KEYCLOAK_REALM:webblock}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:webblock-auth-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    # Only if the Admin API is behind Cloudflare Access (dev from a laptop). Empty = not used.
    cf-access-client-id: ${KEYCLOAK_ADMIN_CF_CLIENT_ID:}
    cf-access-client-secret: ${KEYCLOAK_ADMIN_CF_CLIENT_SECRET:}
    # Change password: client with ONLY Direct access grants ON, used to check the current password
    password-check-client-id: ${KEYCLOAK_PASSWORD_CHECK_CLIENT_ID:webblock-password-check}
    password-check-client-secret: ${KEYCLOAK_PASSWORD_CHECK_CLIENT_SECRET:}
  mail:
    from: ${MAIL_FROM:WebBlock <no-reply@webblock.local>}
