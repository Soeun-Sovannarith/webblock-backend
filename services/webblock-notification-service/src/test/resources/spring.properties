# Spring Framework 7's test cache pauses an idle cached context (stop()) and resumes it when another test class reuses it
# (start()). start() starts EVERY lifecycle bean, including the RabbitMQ listener containers that are configured with
# spring.rabbitmq.listener.simple.auto-startup=false, so a resumed context attached consumers to the broker on localhost
# (found on 2026-10-30: one connection to vhost "/" per full test run). Never pause: a context that was not started stays stopped.
spring.test.context.cache.pause=never
