# Kubernetes (uat / prod), activated with SPRING_PROFILES_ACTIVE=k8s.
# No Eureka: the same service names used by @FeignClient resolve to Kubernetes Service DNS.
eureka:
  client:
    enabled: false

spring:
  cloud:
    discovery:
      client:
        simple:
          instances:
            user-service:
              - uri: http://user-service:8081
            project-service:
              - uri: http://project-service:8082
            payment-service:
              - uri: http://payment-service:8083

# No dev defaults on Kubernetes: a missing secret stops the start instead of failing every notification later.
knock:
  api-key: ${KNOCK_API_KEY}

webblock:
  notification:
    alertmanager:
      webhook-token: ${ALERTMANAGER_WEBHOOK_TOKEN}
